<!DOCTYPE html>
<html>
<head>
<base href="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/lowsadventures2/">
	
	<title>Low's Adventures 2</title>
	<link rel="shortcut icon" href="../../images/ico.ico" type="image/x-icon">



<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fb-root"></div>
<noscript>
		<div id="notSupportedWrap">
			<h2 id="notSupportedTitle">This content requires JavaScript</h2>
			<p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
		</div>
	</noscript>
<script type="text/javascript">
		document.addEventListener('touchmove', function(e) {
		e.preventDefault();
		}, { passive: false }); 

		document.addEventListener("contextmenu", function (e) {
			e.preventDefault();
		}, false);

		window.addEventListener("keydown", function(e)
		{
			if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1)
			{
				e.preventDefault();
			}
		}, false);
	</script>
<script src="scripts/supportcheck.js" type="text/javascript"></script>
<script src="scripts/offlineclient.js" type="module"></script>
<script src="scripts/main.js" type="module"></script>
<script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
