<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borderhopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;
  --bg2:#0d121a;
  --panel:#0f151e;
  --panel2:#131b26;
  --line:#1d2735;
  --line2:#273446;
  --text:#e9edf2;
  --muted:#8391a4;
  --faint:#566376;
  --end:#ff7a59;
  --route:#2fd08a;
  --near:#f0b73e;
  --far:#738196;
  --focus:#9cc7ff;
  --serif:"Fraunces", "Iowan Old Style", Georgia, serif;
  --sans:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 800px at 70% 40%, #0f1c2c 0%, rgba(15,28,44,0) 60%),
    radial-gradient(900px 600px at 0% 100%, #121120 0%, rgba(18,17,32,0) 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:288px 1fr;height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
.side{
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(15,21,30,.92), rgba(10,14,20,.92));
  padding:28px 22px 22px;
  display:flex;flex-direction:column;gap:28px;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--serif);font-weight:650;font-size:27px;letter-spacing:-.01em;line-height:1}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

.streak{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:14px 14px 12px;position:relative;overflow:hidden;
}
.stat .k{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat .v{display:block;font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.stat.cur .v{color:var(--end)}
.stat.bump .v{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

.conts{display:flex;flex-direction:column;gap:6px}
.cont{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 12px;border-radius:10px;border:1px solid transparent;
  background:transparent;cursor:pointer;text-align:left;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s,border-color .15s;
}
.cont:hover{background:var(--panel2);color:var(--text)}
.cont .box{
  width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);flex:none;
  display:grid;place-items:center;transition:all .15s;
}
.cont .box svg{opacity:0;transform:scale(.6);transition:all .15s}
.cont[aria-checked="true"]{color:var(--text);background:rgba(255,122,89,.06);border-color:rgba(255,122,89,.18)}
.cont[aria-checked="true"] .box{background:var(--end);border-color:var(--end)}
.cont[aria-checked="true"] .box svg{opacity:1;transform:scale(1)}
.cont .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
.cont:focus-visible,.btn:focus-visible,.zoom button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.legend{display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--muted);font-weight:500}
.legend div{display:flex;align-items:center;gap:10px}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.side .spacer{flex:1}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin:0}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:22px 28px 20px}
.route{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:4px}
.ends{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;max-width:100%}
.end{
  font-family:var(--serif);font-weight:650;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;line-height:1.1;
}
.connector{display:flex;align-items:center;gap:5px}
.connector i{width:6px;height:6px;border-radius:50%;background:var(--line2);display:block}
.connector i.on{background:var(--route)}
.connector i.ep{width:9px;height:9px;background:var(--end)}
.meta{font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:14px;align-items:center}
.meta b{color:var(--text);font-family:var(--mono);font-weight:600}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

.globe{position:relative;flex:1;min-height:260px;margin:6px 0 4px}
.globe canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.globe canvas.dragging{cursor:grabbing}
.zoom{position:absolute;right:4px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:rgba(15,21,30,.85);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);backdrop-filter:blur(6px);transition:color .15s,border-color .15s;
}
.zoom button:hover{color:var(--text);border-color:#3a4a60}

.result{
  position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  width:min(520px,calc(100% - 24px));
  background:rgba(13,18,26,.92);border:1px solid var(--line2);border-radius:18px;padding:18px 20px;
  backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.5);
  transition:opacity .35s, transform .35s cubic-bezier(.2,.9,.3,1);
}
.result.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.result .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.result h2{margin:0;font-family:var(--serif);font-weight:650;font-size:24px}
.result .sub{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.result .path{margin:12px 0 16px;font-size:14px;line-height:1.7;color:var(--text);font-weight:600}
.result .path > span{white-space:nowrap}
.result .path span.arrow{color:var(--faint);margin:0 2px;font-weight:400}
.result .path .rv{color:var(--muted);font-weight:500;text-decoration:underline dashed rgba(255,255,255,.3);text-underline-offset:4px}

.entry{display:flex;gap:10px;width:min(620px,100%);margin:0 auto;position:relative}
.field{position:relative;flex:1}
.field input{
  width:100%;height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);
  color:var(--text);font:600 16px var(--sans);padding:0 18px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.field input::placeholder{color:var(--faint);font-weight:500}
.field input:focus{border-color:#3d5372;box-shadow:0 0 0 4px rgba(120,170,255,.08)}
.field input:disabled{opacity:.5}
.entry.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.sugg{
  position:absolute;left:0;right:0;bottom:calc(100% + 8px);margin:0;padding:6px;list-style:none;
  background:#111824;border:1px solid var(--line2);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  display:none;z-index:10;max-height:280px;overflow:auto;
}
.sugg.open{display:block}
.sugg li{padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.sugg li .s{color:var(--faint);font-weight:500}
.sugg li.act,.sugg li:hover{background:var(--panel2);color:var(--text)}
.btn{
  height:52px;padding:0 22px;border-radius:14px;border:1px solid transparent;cursor:pointer;font-weight:700;font-size:15px;
  background:var(--end);color:#1a0d08;transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--muted);font-weight:600}
.btn.ghost:hover{color:var(--text);border-color:#3a4a60;filter:none}
.btn:disabled{opacity:.4;cursor:default}

.msg{height:20px;margin:10px auto 0;font-size:13px;color:var(--muted);text-align:center;font-weight:500;transition:opacity .2s}
.msg.err{color:#ff8d7a}

.chips{list-style:none;margin:8px auto 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:820px;min-height:34px}
.chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 9px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1);
}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip .ix{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

@media (max-width: 860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:16px;gap:14px;overflow:visible}
  .brand h1{font-size:22px}
  .streak{grid-template-columns:1fr 1fr}
  .stat{padding:10px 12px}
  .stat .v{font-size:26px;margin-top:2px}
  .conts{flex-direction:row;flex-wrap:wrap;gap:6px}
  .cont{width:auto;padding:7px 10px;font-size:13px;border-color:var(--line)}
  .cont .n{display:none}
  .legend{flex-direction:row;flex-wrap:wrap;gap:14px}
  .side .spacer,.hint{display:none}
  .label{margin-bottom:8px}
  .stage{padding:16px}
  .globe{flex:none;height:min(92vw,520px)}
  .entry{gap:8px}
  .btn{padding:0 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="15.5" fill="none" stroke="#273446" stroke-width="1.5"/>
        <path d="M7 22 C 11 9, 22 9, 27 13" fill="none" stroke="#2fd08a" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 3.5"/>
        <circle cx="7" cy="22" r="3.2" fill="#ff7a59"/>
        <circle cx="27" cy="13" r="3.2" fill="#ff7a59"/>
      </svg>
      <h1>Borderhopper</h1>
    </div>

    <div>
      <p class="label">Streak</p>
      <div class="streak">
        <div class="stat cur" id="statCur"><span class="k">Current</span><span class="v" id="cur">0</span></div>
        <div class="stat"><span class="k">Best</span><span class="v" id="best">0</span></div>
      </div>
    </div>

    <div>
      <p class="label">Continents</p>
      <div class="conts" id="conts" role="group" aria-label="Continents"></div>
    </div>

    <div>
      <p class="label">Key</p>
      <div class="legend">
        <div><span class="sw" style="background:var(--end)"></span>Start and finish</div>
        <div><span class="sw" style="background:var(--route)"></span>On a shortest route</div>
        <div><span class="sw" style="background:var(--near)"></span>Close</div>
        <div><span class="sw" style="background:var(--far)"></span>Off course</div>
      </div>
    </div>

    <div class="spacer"></div>
    <p class="hint">Drag to spin. Scroll or pinch to zoom.</p>
  </aside>

  <main class="stage">
    <header class="route">
      <div class="ends">
        <span class="end" id="startName">&nbsp;</span>
        <span class="connector" id="connector" aria-hidden="true"></span>
        <span class="end" id="endName">&nbsp;</span>
      </div>
      <div class="meta" id="meta"></div>
    </header>

    <div class="globe" id="globe">
      <canvas id="cv" aria-label="Globe"></canvas>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button id="zout" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button id="zfit" aria-label="Recenter"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/><path d="M8 0.5v2.5M8 13v2.5M0.5 8H3M13 8h2.5" stroke-linecap="round"/></svg></button>
      </div>
      <div class="result" id="result" role="dialog" aria-live="polite">
        <div class="top"><h2 id="resTitle"></h2><span class="sub" id="resSub"></span></div>
        <div class="path" id="resPath"></div>
        <button class="btn" id="nextBtn" style="width:100%">Next route</button>
      </div>
    </div>

    <form class="entry" id="entry" autocomplete="off">
      <div class="field">
        <input id="inp" type="text" placeholder="Name a country" spellcheck="false" autocapitalize="words" aria-label="Country" aria-autocomplete="list" aria-controls="sugg">
        <ul class="sugg" id="sugg" role="listbox"></ul>
      </div>
      <button class="btn" type="submit" id="guessBtn">Guess</button>
      <button class="btn ghost" type="button" id="giveBtn">Give up</button>
    </form>
    <div class="msg" id="msg" aria-live="polite"></div>
    <ol class="chips" id="chips"></ol>
  </main>
</div>

  const allowed = allowedFor(sel);

}

  setZoom(view.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))); draw();
}, { passive: false });
const zoomBy = f => { const c = center(); flyTo(c, Math.max(0.8, Math.min(14, view.z * f)), 350); };
$('zin').onclick = () => zoomBy(1.6);
$('zout').onclick = () => zoomBy(1 / 1.6);
$('zfit').onclick = () => S.game ? flyToRoute(true) : flyHome();

/* ================= boot ================= */
buildConts();
const sg = saved.game;
if (sg && sg.start && byId[sg.start] && byId[sg.end] && Array.isArray(sg.guesses)) {
  S.game = sg; hydrate();
  if (S.game.status !== 'play') { render(); const f = routeFrame(); view.l = -f.mid[0]; view.p = -f.mid[1]; view.z = f.z; showResult(); }
  else { render(); const f = routeFrame(); view.l = -f.mid[0] + 40; view.p = -f.mid[1]; view.z = f.z * 0.8; flyToRoute(true); }
} else {
  newGame();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
