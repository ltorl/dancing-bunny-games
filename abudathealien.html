<html>
<head>
<base href="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/abudathealien/">
    

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abuda the Alien</title>
    <link rel="shortcut icon" href="../../images/ico.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }
    </style>
</head>
<body>
    <script>
        function loadLocalRuffle() {
            var script = document.createElement('script');
            script.src = '../../storage/ruffle/ruffle.js';
            document.body.appendChild(script);
        }

        var cdnScript = document.createElement('script');
        cdnScript.src = 'https://unpkg.com/@ruffle-rs/ruffle';
        cdnScript.onerror = loadLocalRuffle;
        document.body.appendChild(cdnScript);
    </script>

    <div id="ruffle" width="100%" height="100%"></div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            player.id = "player";
            player.style.width = "100%";
            player.style.height = "100%";
            container.appendChild(player);
            player.load("abubathealienv32colbe.swf");
        });
    </script>
</body>
</html>
