:root {
	--u: 1px;
	--hl: #999; --hl-hover: #fff; --hl-press: #000; --hl-dis: #262626;
	--bg: #1a1a1a; --bg-hover: #4d4d4d; --bg-press: #fff; --bg-dis: #000;
	--page: #000;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--page); }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: SoubaText, sans-serif; color: var(--hl); }
#stage { position: fixed; inset: 0; cursor: default; }
#stage canvas { position: absolute; left: 0; top: 0; display: block; }
#ui { pointer-events: none; }
#negative { position: fixed; inset: 0; pointer-events: none; opacity: 0; backdrop-filter: invert(1); -webkit-backdrop-filter: invert(1); }
#menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
#menu.show { display: flex; }
.screen { pointer-events: auto; transform: translateX(calc(var(--u) * var(--shift, 0))); max-height: 100%; display: flex; flex-direction: column; justify-content: center; animation: pop .25s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: translateX(calc(var(--u) * (var(--shift, 0) + 40))); opacity: 0; } }
.list { width: calc(var(--u) * 512); max-width: calc(100vw - 32px); display: flex; flex-direction: column; }
.list.wide { width: calc(var(--u) * 768); }
.list.scroll { max-height: calc(100vh - var(--u) * 60); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; }
.list.scroll::-webkit-scrollbar { display: none; }
.row { display: flex; gap: 0; }
.row > .sb { flex: 1 1 0; min-width: 0; width: auto; }
.row > .sb.narrow { flex: 0.33 1 0; }
.sep { height: calc(var(--u) * 16); flex: none; }
.sb { position: relative; display: flex; align-items: center; width: 100%; height: calc(var(--u) * 48); flex: none; margin: 0; padding: 0 0 0 calc(var(--u) * 16); border: 0; border-radius: calc(var(--u) * 24); background: var(--bg); color: var(--hl); font: calc(var(--u) * 30) / 1 SoubaDisplay, sans-serif; text-align: left; cursor: pointer; outline: none; overflow: hidden; transition: background-color .45s ease-out, color .45s ease-out; -webkit-appearance: none; appearance: none; }
.sb .lbl { position: relative; z-index: 1; white-space: pre; overflow: hidden; text-overflow: ellipsis; padding-top: calc(var(--u) * 2); }
.sb:hover, .sb:focus-visible { background: var(--bg-hover); color: var(--hl-hover); transition: none; }
.sb:active, .sb.pressed { background: var(--bg-press); color: var(--hl-press); transition: none; }
.sb.link { color: #00e2ff; }
.sb.link:not(:hover):not(:focus-visible) { color: #009fb3; }
.sb.small { font-size: calc(var(--u) * 19); height: calc(var(--u) * 40); }
.sb.current::after { content: ''; position: absolute; right: calc(var(--u) * 18); top: 50%; width: calc(var(--u) * 14); height: calc(var(--u) * 14); margin-top: calc(var(--u) * -7); border-radius: 50%; background: currentColor; }
.sb.toggle .pip { position: absolute; right: calc(var(--u) * 14); top: 50%; width: calc(var(--u) * 22); height: calc(var(--u) * 22); margin-top: calc(var(--u) * -11); border-radius: 50%; border: calc(var(--u) * 4) solid currentColor; }
.sb.toggle.on .pip { background: currentColor; }
.slider { cursor: ew-resize; touch-action: none; }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bg-hover); border-radius: calc(var(--u) * 24); opacity: .55; }
.slider:hover .fill, .slider:focus-visible .fill { background: var(--hl); opacity: .35; }
.slider .val { position: absolute; right: calc(var(--u) * 18); z-index: 1; font-size: calc(var(--u) * 22); }
.caption { font: calc(var(--u) * 27) / 1.2 SoubaText, sans-serif; color: var(--hl); text-align: center; padding: calc(var(--u) * 8) 0; flex: none; }
.desc { font: calc(var(--u) * 27) / 1.15 SoubaText, sans-serif; color: var(--hl); text-align: center; min-height: calc(var(--u) * 64); padding: 0 calc(var(--u) * 40); flex: none; }
.bigscore { font: calc(var(--u) * 110) / 1 SoubaDisplay, sans-serif; color: var(--hl-hover); text-align: center; padding: calc(var(--u) * 4) 0 calc(var(--u) * 24); flex: none; }
.entry { display: flex; align-items: center; height: calc(var(--u) * 48); flex: none; padding: 0 calc(var(--u) * 16); font: calc(var(--u) * 30) / 1 SoubaDisplay, sans-serif; color: var(--hl); }
.entry:first-child { color: var(--hl-hover); }
.entry .rank { width: calc(var(--u) * 64); opacity: .6; }
.entry .num { flex: 1; text-align: right; font-family: SoubaScore, sans-serif; }
.ach { display: flex; align-items: center; gap: calc(var(--u) * 14); padding: calc(var(--u) * 8) calc(var(--u) * 16); margin-bottom: calc(var(--u) * 6); border-radius: calc(var(--u) * 24); background: var(--bg); flex: none; color: var(--hl-dis); }
.ach .badge { width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: 50%; border: calc(var(--u) * 4) solid currentColor; flex: none; }
.ach.got { color: var(--hl); }
.ach.got .badge { background: #ffd34d; border-color: #ffd34d; }
.ach .name { font: calc(var(--u) * 26) / 1.1 SoubaDisplay, sans-serif; }
.ach.got .name { color: var(--hl-hover); }
.ach .adesc { font: calc(var(--u) * 21) / 1.15 SoubaText, sans-serif; }
#notif { position: fixed; right: calc(var(--u) * 32); bottom: calc(var(--u) * 32); width: calc(var(--u) * 300); height: calc(var(--u) * 136); display: none; justify-content: center; text-align: center; padding: 0 calc(var(--u) * 16); font-size: calc(var(--u) * 28); line-height: 1.15; }
#notif.show { display: flex; }
#notif .lbl { white-space: pre-line; }
#notif.flash { background: #fff; color: #000; }
#ver { position: fixed; right: calc(var(--u) * 6); bottom: calc(var(--u) * 4); font: calc(var(--u) * 18) / 1 SoubaText, sans-serif; color: var(--hl-dis); pointer-events: none; }
body.light .sb.link:not(:hover):not(:focus-visible) { color: #007f90; }
</style>
</head>

	<canvas id="gl"></canvas>

</div>

class Signal {

// a circle that slides along one axis between 0 and length (the groove joint of the danger bumpers)

		const prev = this.prevImpulses;

		for (let i = 0; i < n; i++) {
			const a = subas[i];
			const [cx, cy] = this.gridCell(a.x, a.y);
			for (let gy = cy - 1; gy <= cy + 1; gy++) {
				if (gy < 0 || gy >= GRID_N) continue;
				for (let gx = cx - 1; gx <= cx + 1; gx++) {
					if (gx < 0 || gx >= GRID_N) continue;
					for (let j = head[gy * GRID_N + gx]; j !== -1; j = next[j]) {
						if (j <= i) continue;
						const b = subas[j];
						if (!((a.layer & b.mask) || (b.layer & a.mask))) continue;
						if (a.sobo === b.sobo) {
							const d = Math.abs(a.index - b.index), m = a.sobo.subas.length;
							if (d === 1 || d === m - 1) continue;
						}
						if (a.exceptions && a.exceptions.has(b)) continue;
						const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r;
						const d2 = dx * dx + dy * dy;
						if (d2 >= (rs + CONTACT_MARGIN) * (rs + CONTACT_MARGIN)) continue;
						const d = Math.sqrt(d2);
						const c = this.newContact();
						c.a = a; c.b = b; c.kind = 0;
						if (d > 1e-6) { c.nx = dx / d; c.ny = dy / d; } else { c.nx = 1; c.ny = 0; }
						c.sep = d - rs;
						c.key = a.id * 1048576 + b.id;
						c.imp = prev.get(c.key) || 0;
						const ima = a.frozen ? 0 : a.im, imb = b.frozen ? 0 : b.im;
						c.mEff = ima + imb > 0 ? 1 / (ima + imb) : 0;

							(a._touch ||= []).push(b); (b._touch ||= []).push(a);
						}
					}
				}
			}
			// structure
			if (a.mask & bit(Layer.STRUCTURE)) {
				for (let p = 0; p < this.planes.length; p++) {
					const pl = this.planes[p];
					const dist = pl.nx * a.x + pl.ny * a.y - pl.d;
					const sep = dist - a.r;
					if (sep >= CONTACT_MARGIN) continue;
					const c = this.newContact();
					c.a = null; c.b = a; c.kind = 1; c.nx = pl.nx; c.ny = pl.ny; c.sep = sep;
					c.key = a.id * 1048576 + 1040000 + p;
					c.imp = prev.get(c.key) || 0;
					c.mEff = a.frozen ? 0 : a.mass;
					contacts.push(c);
					if (sep < REPORT_MARGIN) (a._touch ||= []).push(null);
				}
			}
			// sliders
			for (let s = 0; s < this.sliders.length; s++) {
				const sl = this.sliders[s];
				if (!((a.layer & sl.mask) || (sl.layer & a.mask))) continue;
				const dx = a.x - sl.x, dy = a.y - sl.y, rs = a.r + sl.r;
				const d2 = dx * dx + dy * dy;
				if (d2 >= (rs + CONTACT_MARGIN) * (rs + CONTACT_MARGIN)) continue;
				const d = Math.sqrt(d2);
				const c = this.newContact();
				c.a = sl; c.b = a; c.kind = 2;
				c.nx = d > 1e-6 ? dx / d : 1; c.ny = d > 1e-6 ? dy / d : 0;
				c.sep = d - rs;
				c.key = a.id * 1048576 + 1030000 + s;
				c.imp = prev.get(c.key) || 0;
				const proj = c.nx * sl.ax + c.ny * sl.ay;
				const ima = sl.frozen ? 0 : proj * proj * sl.im, imb = a.frozen ? 0 : a.im;
				c.mEff = ima + imb > 0 ? 1 / (ima + imb) : 0;
				c.proj = proj;
				contacts.push(c);
				if (c.sep < REPORT_MARGIN) (a._touch ||= []).push(sl);
			}
		}

		const invDt = 1 / dt;
		for (const c of contacts) {
			const pen = -c.sep;
			if (pen > MAX_PENETRATION) c.target = CONTACT_BIAS * invDt * (pen - MAX_PENETRATION);
			else if (c.sep > 0) c.target = -c.sep * invDt;
			else c.target = 0;
			// warm start
			if (c.imp) applyContactImpulse(c, c.imp);
		}
		for (let it = 0; it < SOLVER_ITERATIONS; it++) {
			for (const c of contacts) {
				if (c.mEff === 0) continue;
				const vn = relNormalVel(c);
				let dImp = (c.target - vn) * c.mEff;
				const old = c.imp; c.imp = Math.max(0, old + dImp); dImp = c.imp - old;
				if (dImp !== 0) applyContactImpulse(c, dImp);
			}
		}
		const imps = this.impulses; imps.clear();
		for (const c of contacts) if (c.imp > 0) imps.set(c.key, c.imp * 0.9);
		this.impulses = prev; this.prevImpulses = imps;

		// integrate velocities
		for (const b of subas) if (!b.frozen) { b.x += b.vx * dt; b.y += b.vy * dt; }
		for (const b of this.embs) if (!b.frozen) { b.x += b.vx * dt; b.y += b.vy * dt; }
		for (const sl of this.sliders) {
			if (sl.frozen) continue;
			sl.s += sl.u * dt;
			if (sl.s < 0) { sl.s = 0; if (sl.u < 0) sl.u = 0; }
			if (sl.s > sl.length) { sl.s = sl.length; if (sl.u > 0) sl.u = 0; }
		}
	}

	// first suba hit by a ray, Godot RayCast2D with hit_from_inside
	raycast(x0, y0, dx, dy, maxLen, layerMask) {
		let best = Infinity, hit = null;
		for (const b of this.subas) {
			if (!(b.layer & layerMask)) continue;
			const ox = b.x - x0, oy = b.y - y0;
			const along = ox * dx + oy * dy;
			const perp2 = ox * ox + oy * oy - along * along;
			const r2 = b.r * b.r;
			if (perp2 > r2) continue;
			const h = Math.sqrt(r2 - perp2);
			let t = along - h;
			if (t < 0) { if (along + h < 0) continue; t = 0; }
			if (t > maxLen) continue;
			if (t < best) { best = t; hit = b; }
		}
		return hit ? { t: best, x: x0 + dx * best, y: y0 + dy * best, body: hit } : null;
	}
	// any suba (or structure) overlapping a circle
	circleHitsAny(x, y, r, withStructure) {
		for (const b of this.subas) {
			if (!(b.layer & bit(Layer.SUBA))) continue;
			const dx = b.x - x, dy = b.y - y, rs = b.r + r;
			if (dx * dx + dy * dy < rs * rs) return true;
		}
		if (withStructure) for (const pl of this.planes) if (pl.nx * x + pl.ny * y - pl.d < r) return true;
		return false;
	}
}
function relNormalVel(c) {
	const b = c.b;
	if (c.kind === 0) return (b.vx - c.a.vx) * c.nx + (b.vy - c.a.vy) * c.ny;
	if (c.kind === 1) return b.vx * c.nx + b.vy * c.ny;
	return b.vx * c.nx + b.vy * c.ny - c.a.u * c.proj;
}
function applyContactImpulse(c, j) {
	const b = c.b;
	if (!b.frozen) { b.vx += c.nx * j * b.im; b.vy += c.ny * j * b.im; }
	if (c.kind === 0) { const a = c.a; if (!a.frozen) { a.vx -= c.nx * j * a.im; a.vy -= c.ny * j * a.im; } }
	else if (c.kind === 2) { const a = c.a; if (!a.frozen) a.u -= c.proj * j * a.im; }
}

const world = new World();

// ---------------------------------------------------------------- sobo data
const circleRadiusFromArea = (a) => Math.sqrt(a / Math.PI);
const circleAreaFromRadius = (r) => Math.PI * r * r;
const circleCircumferenceFromRadius = (r) => TAU * r;
const circleRadiusFromCircumference = (c) => c / TAU;

const SoboManager = {
	distBetweenSubas: SUBA_RADIUS * 2 * (1 - SUBA_OVERLAP),
	flashDecayRate: 60000.0,
	shockwaveLifePerSoboArea: 20000.0,
	overlapRecoveryAcceleration: 200.0,
	allSobos: [],
	datas: [],
	overlapScanFrame: 0,
	activeOverlapRecoveries: [],

	precompute() {
		const dist = this.distBetweenSubas;
		for (let n = 0; n < 20; n++) {
			const sd = { sizeTier: n, doublingTier: Math.round(Math.pow(2, n)), inner: {}, outer: {}, circularPositions: [] };
			const targetOuterArea = Math.pow(1.26, n) * 3700.0;
			const targetOuterRadius = circleRadiusFromArea(targetOuterArea);
			const targetInnerRadius = targetOuterRadius - SUBA_RADIUS;
			const targetInnerCirc = circleCircumferenceFromRadius(targetInnerRadius);
			sd.inner.circumference = snappedf(targetInnerCirc, dist);
			sd.inner.radius = circleRadiusFromCircumference(sd.inner.circumference);
			sd.inner.area = circleAreaFromRadius(sd.inner.radius);
			sd.outer.radius = sd.inner.radius + SUBA_RADIUS;
			sd.outer.area = circleAreaFromRadius(sd.outer.radius);
			sd.outer.circumference = circleCircumferenceFromRadius(sd.outer.radius);
			sd.subaCount = Math.round(sd.inner.circumference / dist);
			const targetMass = sd.outer.area / 350.0;
			sd.extraMassBallMass = targetMass - sd.subaCount;
			sd.totalMass = sd.subaCount + sd.extraMassBallMass;
			const inc = TAU / sd.subaCount;
			for (let si = 0; si < sd.subaCount; si++) sd.circularPositions.push([Math.cos(inc * si) * sd.inner.radius, Math.sin(inc * si) * sd.inner.radius]);
			sd.totalMergedScore = sd.doublingTier * (sd.sizeTier + 1);
			sd.flashDuration = (Math.log(100.0) * sd.outer.area) / this.flashDecayRate;
			this.datas.push(sd);
		}
	},

	create(sizeTier, x = 0, y = 0) {
		const s = new Sobo(sizeTier);
		s.circularize(x, y);
		s.emb.x = x; s.emb.y = y;
		s.enterTree();
		return s;
	},

	freeAll() {
		for (const s of this.allSobos.slice()) s.free(true);
		this.allSobos.length = 0;
		this.activeOverlapRecoveries.length = 0;
		world.subas.length = 0; world.embs.length = 0;
	},

	physicsProcess(dt) {
		this.detectMerges();
		this.detectOverlaps();
		this.processOverlapRecoveries(dt);
	},

	detectMerges() {
		let lowestY = -Infinity, s0 = null, s1 = null;
		for (const a of world.subas) {
			if (!a.sobo || a.sobo.flashing > 0 || a.sobo.mergedThisFrame) continue;
			const list = a.sameTierContacts;
			if (!list) continue;
			for (const b of list) {
				if (b.sobo.flashing > 0 || b.sobo.mergedThisFrame) continue;
				const y = (a.y + b.y) / 2;
				if (y > lowestY) { lowestY = y; s0 = a; s1 = b; }
			}
		}
		if (s1) {
			s0.sobo.mergedThisFrame = true; s1.sobo.mergedThisFrame = true;
			this.merge(s0.sobo, s1.sobo, s0, s1);
		}
	},

	merge(sobo0, sobo1, c0, c1) {
		if (!Game.mode) return;
		const cx = (c0.x + c1.x) / 2, cy = (c0.y + c1.y) / 2;
		Audio2.playMerge(cx, cy, sobo0.data.outer.area);
		Shockwave.create(cx, cy, sobo0.data.outer.area / this.shockwaveLifePerSoboArea);
		const oldPos = [], oldVel = [];
		for (const [s, c] of [[sobo0, c0], [sobo1, c1]]) {
			const m = s.subas.length;
			for (let n = c.index + 1; n < c.index + m - 1; n++) {
				const su = s.subas[posmod(n, m)];
				oldPos.push([su.x, su.y]); oldVel.push([su.vx, su.vy]);
			}
		}
		const ns = new Sobo(sobo0.data.sizeTier + 1);
		ns.merged = true;
		let pathLen = 0; let pp = oldPos[oldPos.length - 1];
		for (const p of oldPos) { pathLen += len(p[0] - pp[0], p[1] - pp[1]); pp = p; }
		const per = pathLen / ns.subas.length;
		let dist = 0;
		for (const su of ns.subas) {
			let walked = 0, last = 0;
			for (let k = 0; k < oldPos.length; k++) {
				const k1 = posmod(k + 1, oldPos.length);
				const a = oldPos[k], b = oldPos[k1];
				const seg = len(b[0] - a[0], b[1] - a[1]);
				walked += seg;
				if (walked > dist) {
					const t = seg > 0 ? (dist - last) / seg : 0;
					su.x = lerp(a[0], b[0], t); su.y = lerp(a[1], b[1], t);
					su.vx = lerp(oldVel[k][0], oldVel[k1][0], t); su.vy = lerp(oldVel[k][1], oldVel[k1][1], t);
					break;
				}
				last = walked;
			}
			dist += per;
		}
		ns.updateCenter(); ns.updatePolygonPoints();
		ns.emb.x = (sobo0.emb.x + sobo1.emb.x) / 2; ns.emb.y = (sobo0.emb.y + sobo1.emb.y) / 2;
		ns.emb.vx = (sobo0.emb.vx + sobo1.emb.vx) / 2; ns.emb.vy = (sobo0.emb.vy + sobo1.emb.vy) / 2;
		ns.flashing = 1; ns.flashElapsed = 0;
		ns.labelAngVel = 50 * Rng.sign(0.5);
		ns.labelRot = sobo0.labelRot;
		ns.enterTree();
		SignalBus.on_sobo_merge.emit(sobo0, sobo1, ns);
		sobo0.free(); sobo1.free();
		Cam.vibrate(ns.data.outer.area * 0.0001);
	},

	detectOverlaps() {
		const subas = world.subas;
		for (let i = this.overlapScanFrame; i < subas.length; i += OVERLAP_SCAN_FRAME_COUNT) {
			const su = subas[i];
			if (!su.touching) continue;
			for (const o of su.touching) {
				if (!o || !o.sobo) continue;
				if (pointInPolygon(su.x, su.y, o.sobo.innerPts)) {
					if (this.hasRecovery(su.sobo, o.sobo)) continue;
					this.activeOverlapRecoveries.push(this.generateRecovery(su, o));
				}
			}
		}
		this.overlapScanFrame = (this.overlapScanFrame + 1) % OVERLAP_SCAN_FRAME_COUNT;
	},

	processOverlapRecoveries(dt) {
		const list = this.activeOverlapRecoveries;
		const acc = this.overlapRecoveryAcceleration;
		for (let ri = list.length - 1; ri >= 0; ri--) {
			const r = list[ri];
			if (r.sobo0.alive && r.sobo1.alive) r.elapsed += dt;
			else { list.splice(ri, 1); continue; }
			if (r.elapsed >= OVERLAP_RECOVERY_TIMEOUT) {
				for (const a of r.over0) for (const b of r.except1) a.removeException(b);
				r.sobo0.fixShape(); r.sobo1.fixShape();
				list.splice(ri, 1); continue;
			}
			if (r.containment) {
				let ex = r.sobo0.cx - r.sobo1.cx, ey = r.sobo0.cy - r.sobo1.cy; const l = len(ex, ey);
				if (l === 0) { ex = 1; ey = 0; } else { ex /= l; ey /= l; }
				for (const su of r.sobo0.subas) su.applyForce(ex * acc * su.mass, ey * acc * su.mass);
				r.sobo0.emb.applyForce(ex * acc * r.sobo0.emb.mass, ey * acc * r.sobo0.emb.mass);
			}
			for (let si = r.over0.length - 1; si >= 0; si--) {
				const a = r.over0[si];
				if (pointInPolygon(a.x, a.y, r.sobo1.outerPts)) {
					if (r.containment) continue;
					const dx = r.sobo0.cx - a.x, dy = r.sobo0.cy - a.y, l = len(dx, dy) || 1;
					a.applyForce((dx / l) * acc * a.mass, (dy / l) * acc * a.mass);
					continue;
				}
				for (const b of r.except1) a.removeException(b);
				r.over0.splice(si, 1);
			}
			for (let si = r.over1.length - 1; si >= 0; si--) {
				const b = r.over1[si];
				if (pointInPolygon(b.x, b.y, r.sobo0.outerPts)) {
					const dx = r.sobo1.cx - b.x, dy = r.sobo1.cy - b.y, l = len(dx, dy) || 1;
					b.applyForce((dx / l) * acc * b.mass, (dy / l) * acc * b.mass);
					continue;
				}
				for (const a of r.over0) a.removeException(b);
				r.over1.splice(si, 1);
			}
			if (r.over0.length === 0 && r.over1.length === 0) list.splice(ri, 1);
		}
	},

	adjacentOverlapping(su, polygon) {
		const out = [su];
		const arr = su.sobo.subas, m = arr.length;
		for (const dir of [-1, 1]) {
			let ai = posmod(su.index + dir, m);
			while (ai !== su.index) {
				const a = arr[ai];
				if (out.includes(a)) break;
				if (pointInPolygon(a.x, a.y, polygon)) { if (dir === -1) out.unshift(a); else out.push(a); }
				else break;
				ai = posmod(ai + dir, m);
			}
		}
		return out;
	},

	generateRecovery(su0, su1) {
		const s0 = su0.sobo, s1 = su1.sobo;
		const over0 = this.adjacentOverlapping(su0, s1.innerPts);
		let over1 = [];
		const m = s1.subas.length;
		for (let off = 0; off < m; off++) {
			const o = s1.subas[(su1.index + off) % m];
			if (pointInPolygon(o.x, o.y, s0.innerPts)) { over1 = this.adjacentOverlapping(o, s0.innerPts); break; }
		}
		const containment = over1.length === 0;
		const except1 = containment ? s1.subas.slice() : over1.slice();
		const r = { sobo0: s0, sobo1: s1, over0, over1, except1, containment, elapsed: 0 };
		for (const a of over0) for (const b of except1) a.addException(b);
		return r;
	},

	hasRecovery(a, b) {
		for (const r of this.activeOverlapRecoveries) if ((r.sobo0 === a && r.sobo1 === b) || (r.sobo0 === b && r.sobo1 === a)) return true;
		return false;
	},

	closestSoboCenter(x, y, maxDist, sobos) {
		let best = Infinity, out = null;
		for (const s of sobos) {
			const d = len(x - s.cx, y - s.cy);
			if (d > maxDist) continue;
			if (d < best) { best = d; out = s; }
		}
		return out;
	},
	furthestInDir(dx, dy, sobos) {
		let best = -Infinity, out = null;
		for (const s of sobos) { const d = s.cx * dx + s.cy * dy; if (d > best) { best = d; out = s; } }
		return out;
	},
	nearestOtherInDir(s0, dx, dy, arr, wrap = true) {
		let best = Infinity, out = null;
		for (const s of arr) {
			if (s === s0) continue;
			const dot = (s.cx - s0.cx) * dx + (s.cy - s0.cy) * dy;
			if (dot <= 0) continue;
			if (dot < best) { best = dot; out = s; }
		}
		if (out) return out;
		if (wrap) return this.furthestInDir(-dx, -dy, arr);
		return null;
	},
	pointInsideAny(x, y) {
		for (const s of this.allSobos) if (pointInPolygon(x, y, s.outerPts)) return true;
		return false;
	},
	largestFittingSizeTier(x, y, maxTier = -1) {
		if (maxTier === -1) maxTier = this.datas[this.datas.length - 1].sizeTier;
		if (this.pointInsideAny(x, y)) return -1;
		let largest = -1;
		for (const sd of this.datas) {
			if (sd.sizeTier > maxTier) break;
			if (!world.circleHitsAny(x, y, sd.outer.radius, true)) largest = sd.sizeTier;
			else break;
		}
		return largest;
	},
};

// ---------------------------------------------------------------- sobo
class Sobo {
	constructor(sizeTier) {
		this.data = SoboManager.datas[sizeTier];
		this.subas = [];
		this.cx = 0; this.cy = 0; this.angle = 0; this.avx = 0; this.avy = 0;
		this.currentInnerArea = 0;
		this.mergedThisFrame = false; this.merged = false;
		this.flashing = 0; this.flashElapsed = 0;
		this.externalContactCount = 0; this.hasExternalContact = false;
		this.frozen = false; this.alive = true; this.inTree = false;
		this.triangulationFailed = false; this.triangulationFailCount = 0;
		this.labelAngVel = 0; this.labelRot = 0;
		const n = this.data.subaCount;
		this.innerPts = []; this.outerPts = []; this.normals = [];
		for (let i = 0; i < n; i++) { this.innerPts.push([0, 0]); this.outerPts.push([0, 0]); this.normals.push([0, 0]); }
		this.emb = new Body(0, 0, 16, this.data.extraMassBallMass);
		this.emb.layer = bit(Layer.EXTRA_MASS_BALL) | bit(Layer.GRAVITY_SUBA); this.emb.mask = 0;
		this.emb.sobo = this;
		for (let si = 0; si < n; si++) {
			const b = new Body(0, 0, SUBA_RADIUS, 1);
			b.layer = bit(Layer.SUBA) | bit(Layer.GRAVITY_SUBA);
			b.mask = bit(Layer.STRUCTURE) | bit(Layer.SUBA) | bit(Layer.ENTERING_SUBA) | bit(Layer.DANGER_BUMPER);
			b.sobo = this; b.index = si;
			b.basePos = this.data.circularPositions[si];
			b.baseAngle = Math.atan2(b.basePos[1], b.basePos[0]);
			b.touching = null; b.sameTierContacts = null; b.wasTouchingCount = 0;
			this.subas.push(b);
		}
		this.scanOffset = Math.floor(Math.random() * 4);
	}
	enterTree() {
		this.inTree = true;
		for (const b of this.subas) world.addSuba(b);
		world.addEmb(this.emb);
		SoboManager.allSobos.push(this);
		SignalBus.on_sobo_enter_tree.emit(this);
	}
	free(silentWorld = false) {
		if (!this.alive) return;
		this.alive = false;
		if (!silentWorld) world.removeBodies([...this.subas, this.emb]);
		const i = SoboManager.allSobos.indexOf(this);
		if (i >= 0) SoboManager.allSobos.splice(i, 1);
		for (const b of this.subas) if (b.exceptions) for (const o of b.exceptions) o.exceptions && o.exceptions.delete(b);
		SignalBus.on_sobo_exit_tree.emit(this);
	}
	circularize(x, y) {
		for (let i = 0; i < this.subas.length; i++) {
			const p = this.data.circularPositions[i];
			this.subas[i].x = x + p[0]; this.subas[i].y = y + p[1];
		}
		this.updateCenter(); this.updatePolygonPoints();
	}
	updateCenter() {
		let x = 0, y = 0;
		for (const b of this.subas) { x += b.x; y += b.y; }
		this.cx = x / this.subas.length; this.cy = y / this.subas.length;
	}

	physicsProcess(dt, frame) {
		this.updateCenter();
		this.angle = this.getAvgAngle();
		this.currentInnerArea = this.getInnerArea();
		this.updateNormals();
		this.updateAvgVelocity();
		if (this.flashing > 0) this.flashDecay(dt);
		if (!this.frozen) {
			this.skinPreservation();
			this.areaPreservation();
			this.embCenteringForce();
		}
		this.updatePolygonPoints();
		if ((frame + this.scanOffset) % 4 === 0) {
			if (!polygonIsSimple(this.innerPts)) { this.triangulationFailCount += 4; this.triangulationFailed = true; }
			else { this.triangulationFailCount = 0; this.triangulationFailed = false; }
			if (this.triangulationFailCount > 10) this.fixShape();
		}
	}
	updatePolygonPoints() {
		for (let i = 0; i < this.subas.length; i++) {
			const b = this.subas[i], n = this.normals[i];
			this.innerPts[i][0] = b.x; this.innerPts[i][1] = b.y;
			this.outerPts[i][0] = b.x + n[0] * 4; this.outerPts[i][1] = b.y + n[1] * 4;
		}
	}
	updateNormals() {
		const s = this.subas, m = s.length;
		let pre = s[m - 1], pos = s[0];
		let ex = pos.x - pre.x, ey = pos.y - pre.y; let l = len(ex, ey) || 1;
		// rotated(-TAU/4) of the edge direction
		let n0x = ey / l, n0y = -ex / l;
		for (let i = 0; i < m; i++) {
			const nxt = s[(i + 1) % m];
			ex = nxt.x - pos.x; ey = nxt.y - pos.y; l = len(ex, ey) || 1;
			const n1x = ey / l, n1y = -ex / l;
			let ax = n0x + n1x, ay = n0y + n1y; const al = len(ax, ay);
			if (al > 1e-6) { ax /= al; ay /= al; } else { ax = n0x; ay = n0y; }
			this.normals[i][0] = ax; this.normals[i][1] = ay;
			n0x = n1x; n0y = n1y; pre = pos; pos = nxt;
		}
	}
	flashDecay(dt) {
		this.flashElapsed += dt;
		if (this.flashElapsed >= this.data.flashDuration) { this.flashing = 0; return; }
		const t = this.flashElapsed / this.data.flashDuration;
		this.flashing = 1 - t * t;
	}
	skinPreservation() {
		const freq = 2300.0, damp = 9.0, rest = SoboManager.distBetweenSubas;
		const s = this.subas;
		let a = s[s.length - 1];
		for (const b of s) {
			const vx = b.x - a.x, vy = b.y - a.y;
			const d = len(vx, vy);
			if (d > rest) {
				const dx = vx / d, dy = vy / d;
				let f = freq * (d - rest);
				f += damp * ((b.vx - a.vx) * dx + (b.vy - a.vy) * dy);
				f *= a.mass;
				a.applyForce(f * dx, f * dy);
				b.applyForce(-f * dx, -f * dy);
			}
			a = b;
		}
	}
	areaPreservation() {
		const k = 0.75;
		const diff = this.data.inner.area - this.currentInnerArea;
		let ax = 0, ay = 0;
		const s = this.subas;
		for (let i = 0; i < s.length; i++) {
			const fx = k * diff * this.normals[i][0] * s[i].mass, fy = k * diff * this.normals[i][1] * s[i].mass;
			s[i].applyForce(fx, fy); ax += fx; ay += fy;
		}
		ax /= s.length; ay /= s.length;
		for (const b of s) b.applyForce(-ax, -ay);
	}
	embCenteringForce() {
		const freq = 200.0, damp = 15.0, e = this.emb;
		let fx = freq * (this.cx - e.x) + damp * (this.avx - e.vx);
		let fy = freq * (this.cy - e.y) + damp * (this.avy - e.vy);
		fx *= e.mass; fy *= e.mass;
		e.applyForce(fx, fy);
		const n = this.subas.length;
		for (const b of this.subas) b.applyForce(-fx / n, -fy / n);
	}
	fixShape() {
		for (const b of this.subas) {
			b.x = this.cx + Math.cos(b.baseAngle) * this.data.inner.radius * 0.1;
			b.y = this.cy + Math.sin(b.baseAngle) * this.data.inner.radius * 0.1;
			b.vx = this.avx; b.vy = this.avy;
		}
	}
	setVelocity(vx, vy) {
		for (const b of this.subas) { b.vx = vx; b.vy = vy; }
		this.emb.vx = vx; this.emb.vy = vy;
	}
	applyUniformAcceleration(ax, ay) {
		for (const b of this.subas) b.applyForce(ax * b.mass, ay * b.mass);
		this.emb.applyForce(ax * this.emb.mass, ay * this.emb.mass);
	}
	setCollisionLayerValue(l, on) { for (const b of this.subas) b.setLayerValue(l, on); }
	setCollisionMaskValue(l, on) { for (const b of this.subas) b.setMaskValue(l, on); }
	getAvgAngle() {
		let a = 0, b = 0;
		for (const s of this.subas) {
			const rx = s.x - this.cx, ry = s.y - this.cy;
			a += rx * s.basePos[0] + ry * s.basePos[1];
			b += rx * s.basePos[1] - ry * s.basePos[0];
		}
		return -Math.atan2(b, a);
	}
	updateAvgVelocity() {
		let x = 0, y = 0;
		for (const s of this.subas) { x += s.vx; y += s.vy; }
		this.avx = x / this.subas.length; this.avy = y / this.subas.length;
	}
	getInnerArea() {
		let s1 = 0, s2 = 0; const s = this.subas;
		let p0 = s[s.length - 1];
		for (const p1 of s) { s1 += p0.x * p1.y; s2 += p0.y * p1.x; p0 = p1; }
		return Math.abs(s1 - s2) / 2;
	}
	// contact bookkeeping, mirrors Suba._on_body_entered / exited via counts
	refreshContacts() {
		let count = 0;
		for (const b of this.subas) {
			const t = b._touch; b.touching = t;
			let same = null;
			if (t) {
				count += t.length;
				for (const o of t) if (o && o.sobo && o.sobo.alive && o.sobo.data.sizeTier === this.data.sizeTier) (same ||= []).push(o);
			}
			b.sameTierContacts = same;
		}
		const had = this.hasExternalContact;
		this.externalContactCount = count;
		this.hasExternalContact = count > 0;
		if (had !== this.hasExternalContact) SignalBus.on_sobo_contact_changed.emit(this, this.hasExternalContact);
	}
	color() {
		const st = Style.current;
		const pal = Style.palette();
		let c = pal[this.data.sizeTier % pal.length].slice();
		const li = st.sobo_palette_lighten || 0, dk = st.sobo_palette_darken || 0;
		for (let i = 0; i < 3; i++) { c[i] = c[i] + (1 - c[i]) * li; c[i] = c[i] * (1 - dk); }
		if (this.flashing > 0) for (let i = 0; i < 3; i++) c[i] *= 1 + this.flashing * 2;
		return c;
	}
}

// ---------------------------------------------------------------- camera
const Cam = {
	vibration: 0, bx: 0, by: 0, vx: 0, vy: 0, rotation: Math.PI, angVel: 0, zoom: 2.395, zoomVel: 0, x: 0, y: 0,
	process(dt) {
		if (Menu.visible) return;
		dt = Math.min(dt, 1 / 15);
		this.vx += 150 * (0 - this.x) * dt; this.vy += 150 * (0 - this.y) * dt;
		this.vx += 12 * -this.vx * dt; this.vy += 12 * -this.vy * dt;
		this.bx += this.vx * dt; this.by += this.vy * dt;
		const targetRot = Settings.data.flipped_camera ? Math.PI : 0;
		const ad = angleDifference(this.rotation, targetRot);
		this.angVel += 150 * ad * dt; this.angVel += 12 * -this.angVel * dt;
		this.rotation += this.angVel * dt;
		this.zoomVel += 100 * (1 - this.zoom) * dt; this.zoomVel += 10 * -this.zoomVel * dt;
		this.zoom += this.zoomVel * dt;
		this.vibration -= this.vibration * 8 * dt;
		const [ox, oy] = Rng.onCircle();
		this.x = this.bx + this.vibration * ox; this.y = this.by + this.vibration * oy;
	},
	push(fx, fy, px = 0, py = 0) {
		const k = Settings.data.screen_push;
		fx *= k; fy *= k;
		this.vx += fx; this.vy += fy;
		this.angVel += (px * fy - py * fx) * 1e-5;
	},
	pushZoom(f) { this.zoomVel += f * Settings.data.screen_push; },
	vibrate(s) { this.vibration += s * Settings.data.screen_vibration; },
};

// ---------------------------------------------------------------- shockwave
const Shockwave = {
	list: [],
	speed: 4000.0,
	create(x, y, life) {
		this.list.push({ x, y, life, scale: 1e-5, hit: new Set() });
		Cam.pushZoom(-life * 0.3);
		let dx = Cam.x - x, dy = Cam.y - y; const l = len(dx, dy);
		if (l > 0) { dx /= l; dy /= l; }
		Cam.push(dx * life * 300, dy * life * 300);
	},
	physicsProcess(dt) {
		for (let i = this.list.length - 1; i >= 0; i--) {
			const s = this.list[i];
			s.life -= dt;
			s.scale += (this.speed / 8) * dt;
			if (s.life <= 0) { this.list.splice(i, 1); continue; }
			const r = 4 * s.scale;
			for (const b of world.subas) {
				if (s.hit.has(b)) continue;
				const dx = b.x - s.x, dy = b.y - s.y, rs = r + b.r;
				if (dx * dx + dy * dy < rs * rs) {
					s.hit.add(b);
					const l = len(dx, dy) || 1, mag = s.life * 100;
					b.applyImpulse((dx / l) * mag * b.mass, (dy / l) * mag * b.mass);
				}
			}
		}
	},
	clear() { this.list.length = 0; },
};

// ---------------------------------------------------------------- spawn pool
class SpawnPool {
	constructor(mergesRequired = [0, 1, 3, 6, 10, 15, 21]) {
		this.mergesRequired = mergesRequired;
		this.pool = []; this.counts = {};
		for (let st = 0; st < mergesRequired.length; st++) if (mergesRequired[st] === 0) this.pool.push(st);
		this.onMerge = (_a, _b, ns) => {
			const st = ns.data.sizeTier;
			if (st >= this.mergesRequired.length || this.pool.includes(st)) return;
			const c = (this.counts[st] || 0) + 1; this.counts[st] = c;
			if (c >= this.mergesRequired[st]) this.pool.push(st);
		};
		SignalBus.on_sobo_merge.connect(this.onMerge);
	}
	dispose() { SignalBus.on_sobo_merge.disconnect(this.onMerge); }
	getSizeTier(exclude) {
		const sp = this.pool.filter((t) => !exclude.includes(t));
		if (!sp.length) return -1;
		return Rng.choose(sp);
	}
}

// ---------------------------------------------------------------- ray detector
class RayDetector {
	constructor(x, y, dirX, indicatorX, indicatorY, detectionDist, gapPushX, gapPushY) {
		this.x = x; this.y = y; this.dx = dirX; this.dy = 0;
		this.maxLen = 808; this.detectionDist = detectionDist;
		this.indOrigX = indicatorX; this.indOrigY = indicatorY;
		this.gapPushX = gapPushX; this.gapPushY = gapPushY;
		this.isColliding = true; this.collisionDist = 0;
		this.collidedTier = -1; this.collidedBarTier = -1;
		this.isBelow = true; this.additionalDist = 0; this.modifiedDist = 0;
		this.smoothedDetection = 0; this.smoothedAdditional = 0; this.flash = 0;
	}
	physicsProcess() {
		const h = world.raycast(this.x, this.y, this.dx, this.dy, this.maxLen, bit(Layer.SUBA));
		if (h) {
			this.isColliding = true;
			this.collisionDist = h.t;
			this.modifiedDist = this.collisionDist + this.additionalDist;
			this.collidedTier = h.body.sobo.data.sizeTier;
			this.isBelow = this.collisionDist < this.detectionDist;
		} else { this.isColliding = false; this.isBelow = false; this.collidedTier = -1; }
		const hb = world.raycast(this.x, this.y, this.dx, this.dy, this.maxLen, bit(Layer.BAR_SUBA));
		this.collidedBarTier = hb ? hb.body.sobo.data.sizeTier : -1;
	}
	process(dt) {
		this.smoothedDetection += dt * (this.collisionDist - this.smoothedDetection) * 10;
		this.smoothedAdditional += dt * (this.additionalDist - this.smoothedAdditional) * 10;
		this.flash += 8 * (0 - this.flash) * dt;
	}
	// indicator segment along the top wall, in world coordinates
	indicator() {
		const gap = Style.current.collider_gap;
		const px = this.x + this.indOrigX + this.gapPushX * gap, py = this.y + this.indOrigY + this.gapPushY * gap;
		const proj = (wx) => clamp((wx - px) * this.dx, 0, this.detectionDist - this.indOrigX * this.dx);
		const maxL = proj(this.x + this.dx * this.detectionDist);
		const d = Math.min(maxL, proj(this.x + this.smoothedDetection * this.dx));
		const ad = Math.min(maxL, proj(this.x + (this.smoothedDetection + this.smoothedAdditional) * this.dx));
		return { px, py, dir: this.dx, maxL, d, ad };
	}
}

// ---------------------------------------------------------------- danger bumper
class DangerBumper {
	constructor(x, y, pushX, pushY, gapPushX, indicatorX) {
		this.x = x; this.y = y; this.gapPushX = gapPushX; this.indicatorX = indicatorX;
		this.body = new SliderBody(x, y, 64, 10, pushX, pushY, 32);
		this.springFreq = 5; this.springDamp = 7; this.fullyPressedHoldTime = 0.5;
		this.holding = false; this.holdTimer = 0; this.distNrm = 0;
		this.state = 'ACTIVE'; this.flash = 0;
		this.sound = null; this.soundDb = -80;
	}
	physicsProcess(dt) {
		if (this.state !== 'ACTIVE') return;
		const b = this.body;
		let f = this.springFreq * -b.s;
		f += this.springDamp * -b.u;
		b.f += f * b.mass;
		this.distNrm = b.s / b.length;
		if (this.distNrm >= 0.99) {
			this.holdTimer = 0;
			if (!this.holding) this.startHolding();
		}
		if (this.holding) {
			if (this.holdTimer > this.fullyPressedHoldTime) this.stopHolding();
			this.holdTimer += dt;
		}
	}
	startHolding() {
		this.holding = true;
		if (this.sound) { this.sound.stop(); this.sound = null; }
	}
	stopHolding() { this.holding = false; this.holdTimer = 0; }
	process(dt) {
		if (this.state !== 'ACTIVE') return;
		this.flash += 4 * (0 - this.flash) * dt;
		if (this.holding) {
			this.flash = 1;
			if (!this.sound) this.sound = Audio2.play('danger', { db: 0, x: this.body.x, y: this.body.y });
			this.soundDb = 0;
			if (this.sound) this.sound.setDb(0);
		} else if (this.sound) {
			this.soundDb = lerp(this.soundDb, -40, dt * 2);
			this.sound.setDb(this.soundDb);
			if (this.soundDb <= -39.5) { this.sound.stop(); this.sound = null; }
		}
	}
	lockInAndDisable() {
		this.body.frozen = true; this.body.s = this.body.length; this.body.u = 0;
		this.state = 'LOCKED'; this.holding = false;
		if (this.sound) { this.sound.stop(); this.sound = null; }
	}
	dispose() { if (this.sound) { this.sound.stop(); this.sound = null; } }
}

// ---------------------------------------------------------------- portal effect
class PortalEffect {
	constructor(x, y, half) {
		this.x = x; this.y = y; this.half = half;
		this.p0 = -half; this.p1 = half; this.alpha = 0; this.contact = false; this.c0 = 0; this.c1 = 0; this.cc = 0;
	}
	physicsProcess() {
		const h0 = world.raycast(this.x, this.y - this.half, 0, 1, this.half * 2, bit(Layer.ENTERING_SUBA));
		if (h0) {
			const h1 = world.raycast(this.x, this.y + this.half, 0, -1, this.half * 2, bit(Layer.ENTERING_SUBA));
			this.contact = true;
			this.c0 = h0.y - this.y; this.c1 = h1 ? h1.y - this.y : this.c0;
			this.cc = (this.c0 + this.c1) * 0.5;
		} else this.contact = false;
	}
	process(dt) {
		const k = Math.min(1, 16 * dt);
		if (this.contact) {
			this.alpha = 1;
			this.p0 = this.c0 - -this.half < this.p0 - -this.half ? this.c0 : lerp(this.p0, this.c0, k);
			this.p1 = this.half - this.c1 < this.half - this.p1 ? this.c1 : lerp(this.p1, this.c1, k);
		} else {
			this.alpha += 4 * (0 - this.alpha) * dt;
			this.p0 = lerp(this.p0, this.cc, k); this.p1 = lerp(this.p1, this.cc, k);
		}
	}
}

		const cs = Style.current;

	process(dt) {

// ---------------------------------------------------------------- audio
const Audio2 = {
	ctx: null, master: null, buffers: {}, ready: false, pending: [],
	init() {
		const AC = window.AudioContext || window.webkitAudioContext;
		if (!AC) return;
		this.ctx = new AC();
		this.comp = this.ctx.createDynamicsCompressor();
		this.comp.threshold.value = -6; this.comp.knee.value = 6; this.comp.ratio.value = 8;
		this.comp.attack.value = 0.003; this.comp.release.value = 0.15;
		this.master = this.ctx.createGain();
		this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
		this.applyVolume();
		for (const [k, b64] of Object.entries(SOUNDS)) {
			const bin = atob(b64), u8 = new Uint8Array(bin.length);
			for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
			this.ctx.decodeAudioData(u8.buffer).then((buf) => { this.buffers[k] = buf; }).catch(() => {});
		}
	},
	unlock() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
	applyVolume() {
		if (!this.master) return;
		this.master.gain.value = Settings.data.mute ? 0 : Settings.data.volume * 0.55;
	},
	// opts: db, gain, rate, x, y (2d position), loop
	play(name, opts = {}) {
		if (!this.ctx || this.ctx.state !== 'running') return null;
		const buf = this.buffers[name];
		if (!buf) return null;
		const src = this.ctx.createBufferSource();
		src.buffer = buf;
		src.playbackRate.value = clamp(opts.rate || 1, 0.01, 16);
		if (opts.loop) src.loop = true;
		const g = this.ctx.createGain();
		let gain = Math.pow(10, (opts.db || 0) / 20) * (opts.gain == null ? 1 : opts.gain);
		let node = src;
		node.connect(g);
		let out = g;
		if (opts.x != null && this.ctx.createStereoPanner) {
			const dx = opts.x - Cam.x, dy = (opts.y || 0) - Cam.y;
			gain *= Math.max(0, 1 - len(dx, dy) / 2000);
			const p = this.ctx.createStereoPanner();
			p.pan.value = clamp((dx / (View.vw * 0.5)) * 1.5 * 0.5, -1, 1);
			g.connect(p); out = p;
		}
		g.gain.value = gain;
		out.connect(this.master);
		src.start();
		const h = {
			src, g, base: gain / Math.pow(10, (opts.db || 0) / 20),
			setDb(db) { g.gain.value = h.base * Math.pow(10, db / 20); },
			setRate(r) { src.playbackRate.value = clamp(r, 0.01, 16); },
			stop() { try { src.stop(); } catch (e) {} },
			playing: true,
		};
		src.onended = () => { h.playing = false; };
		return h;
	},
	playMerge(x, y, area) {
		const pitch = 15000 / area;
		const db = 5 - (3 * Math.log(pitch)) / Math.log(2);
		this.play('merge', { rate: pitch, db, x, y });
	},
};

// ---------------------------------------------------------------- achievements
const Achievements = {
	defs: [], unlocked: {},
	unlockedSignal: new Signal(),
	HOLD_SECONDS: 10, AIR_MERGE_CLEAR_FRAMES: 15,
	init() {
		this.defs = DATA.achievements;
		this.unlocked = Store.get('achievements', {});
		const K = { SCORE_EXACT: 0, AIR_MERGE: 1, BAR: 2, CLEAN: 3, NX_HOLD: 4, NO_MERGE_HOLD: 5, CHAIN: 6, REACH_TIER: 7 };
		this.score = []; this.air = []; this.bar = []; this.clean = []; this.reach = []; this.nx = []; this.noMerge = []; this.chains = [];
		const chainEnds = {};
		for (const d of this.defs) {
			switch (d.kind) {
				case K.SCORE_EXACT: this.score.push({ id: d.id, value: d.value }); break;
				case K.AIR_MERGE: this.air.push({ id: d.id, value: d.value }); break;
				case K.BAR: this.bar.push({ id: d.id, value: d.value }); break;
				case K.CLEAN: this.clean.push({ id: d.id, value: d.value }); break;
				case K.REACH_TIER: this.reach.push({ id: d.id, value: d.value }); break;
				case K.NX_HOLD: this.nx.push({ id: d.id, count: d.count, tier: d.value, elapsed: 0 }); break;
				case K.NO_MERGE_HOLD: this.noMerge.push({ id: d.id, min: d.count, maxAllowed: d.value, elapsed: 0 }); break;
				case K.CHAIN: (chainEnds[d.chain_start] ||= []).push({ id: d.id, value: d.value }); break;
			}
		}
		for (const start of Object.keys(chainEnds).map(Number).sort((a, b) => a - b)) {
			const ends = chainEnds[start].sort((a, b) => a.value - b.value);
			this.chains.push({ start, ends, next: 0, lineage: null, maxEnd: Math.max(...ends.map((e) => e.value)) });
		}
		this.runHadDisallowedMerge = false;
		this.airChecks = [];
		SignalBus.on_game_mode_start.connect(() => {
			this.runHadDisallowedMerge = false;
			for (const h of this.nx) h.elapsed = 0;
			for (const h of this.noMerge) h.elapsed = 0;
			for (const c of this.chains) { c.next = 0; c.lineage = null; }
			this.checkDeferred();
		});
		SignalBus.on_game_over.connect(() => this.tryValue(this.score, Score.current));
		SignalBus.on_sobo_merge.connect((o0, o1, ns) => {
			const v = ns.data.doublingTier;
			for (const h of this.noMerge) if (v > h.maxAllowed) { this.runHadDisallowedMerge = true; h.elapsed = 0; }
			this.tryValue(this.reach, v);
			this.updateChains(o0, o1, ns);
			const air = this.air.find((u) => u.value === v);
			if (air) this.airChecks.push({ sobo: ns, frames: 0, id: air.id });
			this.checkDeferred();
		});
		SignalBus.on_sobo_enter_tree.connect((s) => { this.tryValue(this.reach, s.data.doublingTier); this.checkDeferred(); });
		SignalBus.on_sobo_exit_tree.connect(() => this.checkDeferred());
		SignalBus.on_sobo_launch.connect(() => { for (const c of this.chains) { c.next = 0; c.lineage = null; } this.checkDeferred(); });
		SignalBus.on_sobo_join_bar.connect((s) => { this.tryValue(this.bar, s.data.doublingTier); this.checkDeferred(); });
		SignalBus.on_sobo_leave_bar.connect(() => this.checkDeferred());
		SignalBus.on_safety_spawn.connect(() => this.unlock('ACH_PRAISE_THE_SUNCLE'));
	},
	physicsProcess(dt) {
		for (let i = this.airChecks.length - 1; i >= 0; i--) {
			const a = this.airChecks[i];
			if (!a.sobo.alive || a.sobo.hasExternalContact) { this.airChecks.splice(i, 1); continue; }
			if (++a.frames >= this.AIR_MERGE_CLEAR_FRAMES) { this.unlock(a.id); this.airChecks.splice(i, 1); }
		}
		for (const h of this.nx) {
			let n = 0; for (const s of SoboManager.allSobos) if (s.data.doublingTier === h.tier) n++;
			if (n >= h.count) { h.elapsed += dt; if (h.elapsed >= this.HOLD_SECONDS) this.unlock(h.id); }
			else h.elapsed = 0;
		}
		if (this.deferred) { this.deferred = false; this.checkBoardState(); }
		if (this.runHadDisallowedMerge) return;
		const bm = Game.mode;
		if (!(bm instanceof BarMode)) return;
		const n = bm.inStack.length;
		for (const h of this.noMerge) {
			if (n >= h.min) { h.elapsed += dt; if (h.elapsed >= this.HOLD_SECONDS) this.unlock(h.id); }
			else h.elapsed = 0;
		}
	},
	updateChains(o0, o1, ns) {
		const v = ns.data.doublingTier;
		const nextBy = this.chains.map(() => 0), linBy = this.chains.map(() => null);
		this.chains.forEach((c, i) => {
			if (c.next === 0 || v !== c.next) return;
			if (o0 !== c.lineage && o1 !== c.lineage) return;
			this.tryChainEnds(c, v);
			if (v < c.maxEnd) { nextBy[i] = v * 2; linBy[i] = ns; }
		});
		this.chains.forEach((c, i) => {
			if (v !== c.start * 2) return;
			this.tryChainEnds(c, v);
			if (v < c.maxEnd) { nextBy[i] = v * 2; linBy[i] = ns; }
		});
		this.chains.forEach((c, i) => { c.next = nextBy[i]; c.lineage = linBy[i]; });
	},
	tryChainEnds(c, v) { for (const e of c.ends) if (e.value === v) this.unlock(e.id); },
	checkDeferred() { this.deferred = true; },
	checkBoardState() {
		const bm = Game.mode;
		if (!(bm instanceof BarMode)) return;
		if (bm.inStack.length !== 1) return;
		this.tryValue(this.clean, bm.inStack[0].data.doublingTier);
	},
	tryValue(list, v) { const m = list.find((u) => u.value === v); if (m) this.unlock(m.id); },
	unlock(id) {
		if (this.unlocked[id]) return;
		this.unlocked[id] = Date.now();
		Store.set('achievements', this.unlocked);
		this.unlockedSignal.emit(id);
	},
	clear() { this.unlocked = {}; Store.set('achievements', {}); },
	def(id) { return this.defs.find((d) => d.id === id); },
};

// ---------------------------------------------------------------- input
const Input = {
	device: 'mouse',
	sx: 0, sy: 0, wx: 0, wy: 0, hasCursor: false,
	down: false, startWx: 0, startWy: 0, dragX: 0, dragY: 0,
	pointerType: 'mouse',
	rightStick: [0, 0], leftStick: [0, 0],
	pads: {}, prevButtons: [], stickDirLatch: false,
	updateWorld() {
		[this.wx, this.wy] = View.screenToWorld(this.sx, this.sy);
		if (this.down) { this.dragX = this.wx - this.startWx; this.dragY = this.wy - this.startWy; }
	},
	pollGamepad() {
		const pads = navigator.getGamepads ? navigator.getGamepads() : [];
		let gp = null;
		for (const p of pads) if (p && p.connected) { gp = p; break; }
		if (!gp) { this.rightStick = [0, 0]; this.leftStick = [0, 0]; return; }
		const dz = (x, y, mn) => { const l = len(x, y); if (l < mn) return [0, 0]; const k = clamp((l - mn) / (1 - mn), 0, 1) / l; return [x * k, y * k]; };
		this.leftStick = dz(gp.axes[0] || 0, gp.axes[1] || 0, 0.25);
		this.rightStick = dz(gp.axes[2] || 0, gp.axes[3] || 0, 0.25);
		const btn = gp.buttons.map((b) => b.pressed);
		const pressed = (i) => btn[i] && !this.prevButtons[i];
		const any = btn.some((b) => b) || this.leftStick[0] || this.leftStick[1] || this.rightStick[0] || this.rightStick[1];
		if (any) this.device = 'gamepad';
		if (this.device === 'gamepad') {
			let dir = null;
			if (pressed(12)) dir = [0, -1]; else if (pressed(13)) dir = [0, 1]; else if (pressed(14)) dir = [-1, 0]; else if (pressed(15)) dir = [1, 0];
			const ls = this.leftStick;
			if (!dir && len(ls[0], ls[1]) > 0.6 && !this.stickDirLatch) {
				this.stickDirLatch = true;
				dir = Math.abs(ls[0]) > Math.abs(ls[1]) ? [Math.sign(ls[0]), 0] : [0, Math.sign(ls[1])];
			}
			if (len(ls[0], ls[1]) < 0.3) this.stickDirLatch = false;
			if (dir) Game.onDirection(dir[0], dir[1]);
			if (pressed(5)) Game.onLaunchButton();
			if (pressed(0)) Game.onAccept();
			if (pressed(1)) Game.onBack();
			if (pressed(9)) Game.onMenuButton();
		}
		this.prevButtons = btn;
	},
};

// ---------------------------------------------------------------- view
const View = {
	W: 1, H: 1, dpr: 1, s: 1, vw: 720, vh: 720, compact: false,
	resize() {
		this.dpr = Math.min(window.devicePixelRatio || 1, 2);
		this.W = window.innerWidth; this.H = window.innerHeight;
		// keep_height like the original, but never let the play area overflow narrow screens
		const sH = this.H / 720, sW = this.W / 680;
		this.compact = this.W / sH < 1000;
		this.s = this.compact ? Math.min(this.H / 860, sW) : sH;
		this.vw = this.W / this.s; this.vh = this.H / this.s;
		for (const c of [worldCanvas, uiCanvas, glCanvas]) {
			c.width = Math.round(this.W * this.dpr); c.height = Math.round(this.H * this.dpr);
			c.style.width = this.W + 'px'; c.style.height = this.H + 'px';
		}
		document.documentElement.style.setProperty('--u', this.s + 'px');
	},
	// world -> css pixels
	worldToScreen(x, y) {
		const dx = x - Cam.x, dy = y - Cam.y, c = Math.cos(-Cam.rotation), sn = Math.sin(-Cam.rotation);
		const rx = dx * c - dy * sn, ry = dx * sn + dy * c, k = Cam.zoom * this.s;
		return [this.W / 2 + rx * k, this.H / 2 + ry * k];
	},
	screenToWorld(px, py) {
		const k = Cam.zoom * this.s;
		const rx = (px - this.W / 2) / k, ry = (py - this.H / 2) / k;
		const c = Math.cos(Cam.rotation), sn = Math.sin(Cam.rotation);
		return [rx * c - ry * sn + Cam.x, rx * sn + ry * c + Cam.y];
	},
	applyWorld(ctx) {
		const k = Cam.zoom * this.s * this.dpr;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.translate((this.W / 2) * this.dpr, (this.H / 2) * this.dpr);
		ctx.scale(k, k);
		ctx.rotate(-Cam.rotation);
		ctx.translate(-Cam.x, -Cam.y);
	},
	applyUI(ctx) {
		const k = this.s * this.dpr;
		// Ui._0.offset = -cam position: the ui shakes along with the camera
		ctx.setTransform(k, 0, 0, k, -Cam.x * k, -Cam.y * k);
	},
};

const worldCanvas = document.createElement('canvas');
const wctx = worldCanvas.getContext('2d');
const glCanvas = document.getElementById('gl');
const uiCanvas = document.getElementById('ui');
const uctx = uiCanvas.getContext('2d');

// ---------------------------------------------------------------- world drawing
function strokePolyline(ctx, pts, closed) {
	ctx.beginPath();
	ctx.moveTo(pts[0][0], pts[0][1]);
	for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
	if (closed) ctx.closePath();
}
function roundLine(ctx, x0, y0, x1, y1, w, color) {
	ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
	ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function disc(ctx, x, y, r, color) {
	ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill();
}
function offsetPolygon(poly, amount) {
	const out = [], n = poly.length;
	let area = 0;
	for (let i = 0; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
	const sgn = area > 0 ? 1 : -1;
	for (let i = 0; i < n; i++) {
		const p0 = poly[(i - 1 + n) % n], p1 = poly[i], p2 = poly[(i + 1) % n];
		let ex = p1[0] - p0[0], ey = p1[1] - p0[1], l = len(ex, ey); ex /= l; ey /= l;
		let fx = p2[0] - p1[0], fy = p2[1] - p1[1]; l = len(fx, fy); fx /= l; fy /= l;
		// outward normals
		const n0x = ey * sgn, n0y = -ex * sgn, n1x = fy * sgn, n1y = -fx * sgn;
		let bx = n0x + n1x, by = n0y + n1y; l = len(bx, by); bx /= l; by /= l;
		const k = amount / (bx * n0x + by * n0y);
		out.push([p1[0] + bx * k, p1[1] + by * k]);
	}
	return out;
}

function drawWorld() {
	const ctx = wctx, st = Style.current;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = css(st.background_color, 1);
	ctx.fillRect(0, 0, worldCanvas.width, worldCanvas.height);
	View.applyWorld(ctx);
	ctx.lineJoin = 'round';
	const mode = Game.mode;
	const gap = st.collider_gap;

	if (mode) {
		// active sobo markers (z 10)
		for (const s of mode.onBar) {
			let r = 4, c = [1, 1, 1, 0.5];
			if (s === mode.launching) { r = 8; c = [1, 1, 1, 1]; }
			else if (s === mode.hovered) { c = [1, 1, 1, 1]; }
			disc(ctx, s.cx, -320, r, css(c));
		}
		// danger bumpers (z 10)
		for (const b of [mode.bumperLeft, mode.bumperRight]) {
			const x = b.body.x, y = b.body.y;
			disc(ctx, x, y, 64 - gap - 1, css(st.indicator_color));
			ctx.strokeStyle = css(st.structure_color); ctx.lineWidth = 8;
			ctx.beginPath(); ctx.arc(x, y, 64 - gap - 4, 0, TAU); ctx.stroke();
		}
	}

	// outline of hovered / launching sobo (z 20)
	const o = Outline.sobo;
	if (o && o.alive) {
		ctx.strokeStyle = css(o.color);
		ctx.lineWidth = SUBA_RADIUS * 2 - gap * 2 - 0.5 + Outline.thick * 2;
		strokePolyline(ctx, o.innerPts, true); ctx.stroke();
	}
	Outline.sobo = null;

	// sobos (z 40)
	const lw = SUBA_RADIUS * 2 - gap * 2 - 0.5;
	for (const s of SoboManager.allSobos) {
		const col = css(s.color(), 1);
		ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = lw;
		strokePolyline(ctx, s.innerPts, true);
		if (!s.triangulationFailed) ctx.fill();
		ctx.stroke();
	}
	// launch arrow (z 42)
	if (LaunchArrow.enabled) drawArrow(ctx);
	// sobo labels (z 45)
	ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
	ctx.font = '15px SoubaScore';
	for (const s of SoboManager.allSobos) {
		ctx.save();
		ctx.translate(s.emb.x, s.emb.y);
		ctx.rotate(s.labelRot);
		ctx.fillStyle = css(st.sobo_label_color, s.merged ? 1 : 0.4);
		ctx.fillText(String(s.data.doublingTier), 0, 1);
		ctx.restore();
	}
	// instructions (z 50)
	if (mode && mode.instructions && mode.instructions.alpha > 0.01) drawInstructions(ctx, mode.instructions.alpha);

	if (mode) {
		// out of bounds (z 60)
		const poly = offsetPolygon(mode.poly, gap);
		ctx.fillStyle = css(st.out_of_bounds_color);
		ctx.beginPath();
		ctx.rect(-4000, -4000, 8000, 8000);
		ctx.moveTo(poly[0][0], poly[0][1]);
		for (let i = poly.length - 1; i >= 1; i--) ctx.lineTo(poly[i][0], poly[i][1]);
		ctx.closePath();
		ctx.fill('evenodd');
		const outl = offsetPolygon(mode.poly, gap + 12);
		ctx.strokeStyle = css(st.structure_color); ctx.lineWidth = 24; ctx.lineJoin = 'round';
		strokePolyline(ctx, outl, true); ctx.stroke();
		ctx.lineJoin = 'round';

		// danger bumper beam (z 72)
		if (mode.beam.visible && mode.beam.alpha > 0.005) {
			ctx.fillStyle = css([1, 0.18433, 0.23907], mode.beam.alpha);
			const h = 128 * mode.beam.scaleY;
			ctx.fillRect(-1024, -112 - h / 2, 2048, h);
		}
		// ray detector indicators (z 100)
		for (const d of [mode.rayLeft, mode.rayRight]) {
			const ind = d.indicator();
			const seg = (l, c, a) => roundLine(ctx, ind.px, ind.py, ind.px + ind.dir * l, ind.py, 8, css(c, a));
			seg(ind.maxL, st.indicator_recess_color);
			seg(ind.ad, st.indicator_special_color);
			seg(ind.d, st.indicator_color);
			if (d.flash > 0.01) seg(ind.maxL, st.indicator_flash_color, d.flash);
		}
		// danger bumper indicators (z 100)
		for (const b of [mode.bumperLeft, mode.bumperRight]) {
			const x = b.x + b.gapPushX * (1 + gap) + b.indicatorX;
			roundLine(ctx, x, b.y - 64, x, b.y + 64, 8, css(st.indicator_recess_color));
			const h = 64 * clamp(b.distNrm, 0.01, 1);
			roundLine(ctx, x, b.y - h, x, b.y + h, 8, css(st.indicator_color));
			if (b.flash > 0.01) roundLine(ctx, x, b.y - 64, x, b.y + 64, 8, css(st.indicator_danger_color, b.flash));
		}
		// portal effects (z 100)
		for (const p of [mode.portalLeft, mode.portalRight]) {
			if (p.alpha < 0.01) continue;
			roundLine(ctx, p.x, p.y + p.p0, p.x, p.y + p.p1, 8, css([1, 1, 1], p.alpha));
		}
	}
}

function drawArrow(ctx) {
	const A = LaunchArrow, color = css(Style.current.launch_arrow_color);
	const tipx = A.x + A.vx, tipy = A.y + A.vy;
	const l = len(A.vx, A.vy);
	const maxThick = 16;
	const thick = Math.min(maxThick, 1400 / Math.max(l, 0.001));
	disc(ctx, A.x, A.y, maxThick, color);
	roundLine(ctx, A.x, A.y, tipx, tipy, thick, color);
	disc(ctx, tipx, tipy, thick / 2, color);
	const hx = -A.vx * A.headScale, hy = -A.vy * A.headScale;
	const ang = (remap(l, 0, A.maxLength, 85, 20) * Math.PI) / 180;
	for (const a of [ang, -ang]) {
		const [rx, ry] = rotate(hx, hy, a);
		disc(ctx, tipx + rx, tipy + ry, thick / 2, color);
		roundLine(ctx, tipx, tipy, tipx + rx, tipy + ry, thick, color);
	}
}

function drawMouseIcon(ctx, x, y, kind) {
	// small mouse glyph: kind 'left' | 'right' | 'none' | 'move'
	const w = 26, h = 34, r = 13;
	const st = Style.current, ic = st.instructions_color;
	ctx.save(); ctx.translate(x, y);
	ctx.fillStyle = css(ic);
	ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
	ctx.fillStyle = css([0.91 * ic[0], 0.16 * ic[1], 0.24 * ic[2], 1]);
	if (kind === 'left' || kind === 'right') {
		ctx.beginPath();
		if (kind === 'left') { ctx.moveTo(0, -h / 2); ctx.lineTo(0, -3); ctx.lineTo(-w / 2, -3); ctx.arcTo(-w / 2, -h / 2, 0, -h / 2, r); }
		else { ctx.moveTo(0, -h / 2); ctx.lineTo(0, -3); ctx.lineTo(w / 2, -3); ctx.arcTo(w / 2, -h / 2, 0, -h / 2, r); }
		ctx.closePath(); ctx.fill();
	}
	ctx.strokeStyle = css(st.background_color); ctx.lineWidth = 2.5;
	ctx.beginPath(); ctx.moveTo(-w / 2, -3); ctx.lineTo(w / 2, -3); ctx.moveTo(0, -h / 2); ctx.lineTo(0, -3); ctx.stroke();
	if (kind === 'move') {
		ctx.fillStyle = css(ic);
		for (const [ax, ay] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
			ctx.beginPath();
			const cx = ax * 26, cy = ay * 24;
			ctx.moveTo(cx + ax * 6, cy + ay * 6);
			ctx.lineTo(cx - ay * 6, cy + ax * 6);
			ctx.lineTo(cx + ay * 6, cy - ax * 6);
			ctx.fill();
		}
	}
	ctx.restore();
}

function drawInstructions(ctx, alpha) {
	const touch = Input.pointerType === 'touch';
	const pad = Input.device === 'gamepad';
	const lines = pad
		? [['select', 'dpad / left stick'], ['aim', 'right stick'], ['launch', 'RB'], null, ['or use mouse', '']]
		: touch
			? [['touch and hold', ''], ['drag to aim', ''], ['release to launch', ''], ['second finger to cancel', '']]
			: [['click and hold', 'left'], ['drag to aim', 'move'], ['release to launch', 'none'], ['cancel launch', 'right'], null, ['or use gamepad', 'pad']];
	ctx.save();
	ctx.rotate(Cam.rotation);
	ctx.globalAlpha = alpha;
	ctx.font = '27px SoubaText';
	ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
	ctx.fillStyle = css(Style.current.instructions_color);
	let y = -(lines.length * 48) / 2 + 24;
	for (const ln of lines) {
		if (!ln) { y += 16; continue; }
		const [text, icon] = ln;
		const tw = ctx.measureText(text).width;
		const iw = icon && !pad ? (icon === 'move' ? 68 : 40) : 0;
		const x0 = -(tw + iw) / 2;
		if (pad && icon) {
			ctx.textAlign = 'center';
			ctx.fillText(text + '  ' + icon, 0, y);
			ctx.textAlign = 'right';
		} else {
			ctx.fillText(text, x0 + tw, y);
			if (icon === 'pad') {
				ctx.beginPath(); ctx.roundRect(x0 + tw + 10, y - 11, 34, 22, 10); ctx.fill();
				ctx.fillStyle = css(Style.current.background_color);
				ctx.fillRect(x0 + tw + 16, y - 2, 9, 3); ctx.fillRect(x0 + tw + 19, y - 5, 3, 9);
				disc(ctx, x0 + tw + 34, y - 3, 2.2, ctx.fillStyle); disc(ctx, x0 + tw + 38, y + 1, 2.2, ctx.fillStyle);
				ctx.fillStyle = css(Style.current.instructions_color);
			} else if (icon) drawMouseIcon(ctx, x0 + tw + (icon === 'move' ? 40 : 26), y, icon);
		}
		y += 48 + (pad ? 0 : 6);
	}
	ctx.restore();
}

// ---------------------------------------------------------------- composite (shockwave distortion)
const GL = {
	ok: false, gl: null, tex: null, prog: null, u: {},
	init() {
		let gl = null;
		try { gl = glCanvas.getContext('webgl', { premultipliedAlpha: false, alpha: false, antialias: false }); } catch (e) {}
		if (!gl) { glCanvas.replaceWith(worldCanvas); worldCanvas.id = 'gl'; return; }
		const vs = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;uv.y=1.0-uv.y;gl_Position=vec4(p,0.0,1.0);}';
		const fs = `precision highp float;
varying vec2 uv;
uniform sampler2D t;
uniform vec2 res;
uniform vec4 waves[16];
uniform int count;
uniform vec4 shakes[2];
void main(){
	vec2 px = uv * res;
	vec2 off = vec2(0.0);
	for (int i = 0; i < 16; i++) {
		if (i >= count) break;
		vec4 w = waves[i];
		vec2 d = (px - w.xy) / (2.0 * w.z);
		float r = length(d) * 2.0;
		if (r <= 1.0) off += d * (w.w * 50.0) * pow(clamp(r, 0.0, 1.0), 4.0);
	}
	for (int i = 0; i < 2; i++) {
		vec4 s = shakes[i];
		if (s.z <= 0.0) continue;
		float l = length(px - s.xy) / s.z;
		if (l <= 1.0) off += vec2(-10.0) * (1.0 - l) * vec2(fract(sin(s.w * 12.9898) * 43758.5453) * 2.0 - 1.0, fract(sin(s.w * 78.233) * 43758.5453) * 2.0 - 1.0) * res.y / 860.0;
	}
	gl_FragColor = vec4(texture2D(t, (px + off) / res).rgb, 1.0);
}`;
		const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
		try {
			const p = gl.createProgram();
			gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
			gl.useProgram(p);
			const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
			gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
			const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
			this.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.tex);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
			for (const n of ['t', 'res', 'waves', 'count', 'shakes']) this.u[n] = gl.getUniformLocation(p, n);
			this.gl = gl; this.prog = p; this.ok = true;
			this.waveData = new Float32Array(64); this.shakeData = new Float32Array(8);
		} catch (e) {
			console.warn('webgl composite unavailable', e);
			glCanvas.replaceWith(worldCanvas); worldCanvas.id = 'gl';
		}
	},
	draw() {
		if (!this.ok) return;
		const gl = this.gl;
		gl.viewport(0, 0, glCanvas.width, glCanvas.height);
		gl.bindTexture(gl.TEXTURE_2D, this.tex);
		gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, worldCanvas);
		const k = Cam.zoom * View.s * View.dpr;
		let n = 0;
		for (const w of Shockwave.list) {
			if (n >= 16) break;
			const [sx, sy] = View.worldToScreen(w.x, w.y);
			this.waveData.set([sx * View.dpr, sy * View.dpr, 4 * w.scale * k, w.life * View.dpr], n * 4); n++;
		}
		this.shakeData.fill(0);
		const m = Game.mode;
		if (m && m.bumperLeft) {
			[m.bumperLeft, m.bumperRight].forEach((b, i) => {
				if (!b.holding || b.state !== 'ACTIVE') return;
				const [sx, sy] = View.worldToScreen(b.body.x, b.body.y);
				this.shakeData.set([sx * View.dpr, sy * View.dpr, 192 * k, 1 + Math.random() * 100], i * 4);
			});
		}
		gl.uniform2f(this.u.res, glCanvas.width, glCanvas.height);
		gl.uniform4fv(this.u.waves, this.waveData);
		gl.uniform1i(this.u.count, n);
		gl.uniform4fv(this.u.shakes, this.shakeData);
		gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
	},
};

// ---------------------------------------------------------------- sdf-style labels
const SDF_ADV = { ' ': 0.8, i: 0.4, j: 0.6, l: 0.6, r: 0.6, c: 0.7, L: 0.7, M: 1.0, W: 1.0 };
const sdfAdv = (ch) => (/[0-9]/.test(ch) ? 1.0 : SDF_ADV[ch] != null ? SDF_ADV[ch] : 0.8);
const SDF = {
	fontPx: 80,
	measure() {
		const c = document.createElement('canvas').getContext('2d');
		c.font = '100px SoubaDisplay';
		const m = c.measureText('o');
		const h = (m.actualBoundingBoxAscent || 50) + (m.actualBoundingBoxDescent || 0);
		// the original 'o' glyph is about 43 units tall before the 1.5x label scale
		this.fontPx = (43 / h) * 100;
	},
	// draws text centred at (x,y) along direction rot, with the original glyph advances
	draw(ctx, text, x, y, rot, scale, spacing, color) {
		ctx.save();
		ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
		ctx.font = this.fontPx + 'px SoubaDisplay';
		ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
		ctx.fillStyle = color;
		let total = 0;
		for (const ch of text) total += sdfAdv(ch) * 73.3512413512 + spacing;
		total -= spacing;
		let px = -total / 2;
		for (const ch of text) {
			const a = sdfAdv(ch) * 73.3512413512;
			if (ch !== ' ') {
				if (/[0-9]/.test(ch)) {
					// the original sdf digits are taller than this font's digits
					ctx.save(); ctx.translate(px + a / 2, 0); ctx.scale(1.3, 1.65); ctx.fillText(ch, 0, 0); ctx.restore();
				} else ctx.fillText(ch, px + a / 2, 0);
			}
			px += a + spacing;
		}
		ctx.restore();
		return total * scale;
	},
};

// ---------------------------------------------------------------- side panels
class SidePanel {
	constructor(side, freq, damp) {
		this.side = side; this.freq = freq; this.damp = damp;
		this.x = side * 2560; this.xVel = 0; this.edgeTarget = 0;
		this.hl = null; this.bg = [0, 0, 0, 0]; this.hovered = false; this.pressed = false; this.disabled = false;
	}
	process(dt) {
		const mid = View.vw / 2;
		dt = Math.min(dt, 1 / 15);
		const target = (mid + this.edgeTarget) * this.side;
		this.xVel += this.freq * (target - this.x) * dt;
		this.xVel += this.damp * -this.xVel * dt;
		this.x += this.xVel * dt;
		const st = Style.current;
		let hlT, bgT;
		if (this.disabled) { hlT = st.ui_panel_highlight_disabled_color; bgT = st.ui_panel_background_disabled_color; }
		else if (this.pressed) { hlT = st.ui_panel_highlight_pressed_color; bgT = st.ui_panel_background_pressed_color; }
		else if (this.hovered) { hlT = st.ui_panel_highlight_hover_color; bgT = st.ui_panel_background_hover_color; }
		else { hlT = st.ui_panel_highlight_color; bgT = st.ui_panel_background_color; }
		this.hl = fadeColor(this.hl, hlT, dt);
		this.bg = fadeColor(this.bg, bgT, dt);
	}
	// edge facing the play area, in ui units
	edge() { return this.side < 0 ? this.x + View.vw : this.x; }
	contains(ux) { return this.side < 0 ? ux < this.edge() : ux > this.edge(); }
}
// SoboButton.p_item_value: brighten instantly, darken slowly
function fadeColor(cur, target, dt) {
	if (!cur) return target.slice();
	const v = (c) => Math.max(c[0], c[1], c[2]);
	if (v(target) > v(cur)) return target.slice();
	const k = Math.min(1, dt * 5);
	return cur.map((c, i) => lerp(c, target[i], k));
}

const UI = {
	leftPanel: new SidePanel(-1, 200, 20),
	rightPanel: new SidePanel(1, 160, 16),
	dimmer: 0, flasher: 0, negative: 0,
	title: 'sobosuba', titleScale: 1.5,
	smoothedScore: 0, displayedScore: 0, scoreSfx: null,
	addLabels: [],
	init() {
		SignalBus.on_gain_score.connect((a) => {
			this.addLabels.push({ text: '+' + a, alpha: 50, y: 128 + (this.addLabels.length + 1) * 48 });
		});
		SignalBus.on_game_mode_start.connect(() => { this.smoothedScore = 0; });
	},
	refreshPanelTargets() {
		if (Menu.visible) {
			if (Menu.current) { this.leftPanel.edgeTarget = Menu.current.left; this.rightPanel.edgeTarget = Menu.current.right; }
		} else if (Game.mode) {
			this.leftPanel.edgeTarget = Game.mode.leftPanelTarget;
			this.rightPanel.edgeTarget = -Game.mode.rightPanelTarget;
		}
	},
	playHoverSound(mouseSpeedPitch) {
		Audio2.play('hover', { db: -2, rate: mouseSpeedPitch ? 0.1 + Input.mouseSpeed * 0.02 : 0.5 });
	},
	playButtonUp(unhovered) { Audio2.play('btnup', unhovered ? { db: 2, rate: 0.8 } : { db: 4 }); },
	playButtonDown() { Audio2.play('btndown', { db: 9 }); },
	process(dt) {
		this.leftPanel.disabled = !Game.mode && Menu.current === Screens.main && Menu.visible;
		this.leftPanel.process(dt); this.rightPanel.process(dt);
		const dimTarget = Menu.visible ? 0.9 : 0;
		this.dimmer = lerp(this.dimmer, dimTarget, Math.min(1, 8 * dt));
		this.flasher = lerp(this.flasher, 0, Math.min(1, 0.5 * dt));
		this.negative = lerp(this.negative, 0, Math.min(1, 4 * dt));
		negativeEl.style.opacity = this.negative.toFixed(3);
		// score counter
		if (Game.mode) {
			const target = Score.current;
			if (this.displayedScore !== target) {
				if (!this.scoreSfx || !this.scoreSfx.playing) this.scoreSfx = Audio2.play('scoreblip', {});
				const diff = target - this.displayedScore;
				if (diff > 0 && this.scoreSfx) this.scoreSfx.setRate(1 + diff * 0.05);
				this.smoothedScore = lerp(this.smoothedScore, target, Math.min(1, dt * 8));
			} else if (this.scoreSfx) { this.scoreSfx.stop(); this.scoreSfx = null; }
			this.displayedScore = Math.round(this.smoothedScore);
		}
		let y = 128;
		for (let i = 0; i < this.addLabels.length; i++) {
			const l = this.addLabels[i];
			l.y = lerp(l.y, y, Math.min(1, dt * 3));
			l.alpha = lerp(l.alpha, 0, Math.min(1, dt * (i === 0 ? 4 : 2)));
			if (l.alpha <= 0.01) { this.addLabels.splice(i, 1); i--; } else y += 40;
		}
	},
	draw() {
		const ctx = uctx;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
		if (this.dimmer > 0.003) { ctx.fillStyle = `rgba(0,0,0,${this.dimmer})`; ctx.fillRect(0, 0, uiCanvas.width, uiCanvas.height); }
		if (this.flasher > 0.003) {
			ctx.globalCompositeOperation = 'lighter';
			ctx.fillStyle = `rgba(255,255,255,${this.flasher})`; ctx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
			ctx.globalCompositeOperation = 'source-over';
		}
		View.applyUI(ctx);
		const vh = View.vh, mid = vh / 2;
		const L_ = this.leftPanel, R_ = this.rightPanel;
		if (View.compact) { this.drawCompact(ctx); return; }
		// left panel
		if (L_.bg[3] > 0.003) { ctx.fillStyle = css(L_.bg); ctx.fillRect(L_.x - 4000, -4000, View.vw + 4000, vh + 8000); }
		const le = L_.edge();
		SDF.draw(ctx, this.title, le - 56, mid - 2, -Math.PI / 2, this.titleScale, -15, css(L_.hl));
		// icons (back / menu)
		const ix = le - 128, iy = mid;
		ctx.save(); ctx.strokeStyle = css(L_.hl); ctx.lineCap = 'round'; ctx.lineWidth = 32 * 0.24;
		if (Menu.visible) { if (Menu.canGoBack()) drawBackIcon(ctx, ix, iy, 32); }
		else drawMenuIcon(ctx, ix, iy, 32);
		ctx.restore();
		// right panel
		if (R_.bg[3] > 0.003) { ctx.fillStyle = css(R_.bg); ctx.fillRect(R_.x, -4000, View.vw + 4000, vh + 8000); }
		const re = R_.edge();
		if (Game.mode) SDF.draw(ctx, String(this.displayedScore), re + 72, mid, Math.PI / 2, 1.5, -14.7, css(R_.hl));
		ctx.font = '32px SoubaScore'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
		for (const l of this.addLabels) {
			ctx.fillStyle = css(Style.current.ui_highlight_hover_color, clamp(l.alpha, 0, 1));
			ctx.fillText(l.text, re + 144, l.y);
		}
	},
	drawCompact(ctx) {
		const vw = View.vw, vh = View.vh, mid = vh / 2;
		const top = mid - 344 * Cam.zoom;
		const L_ = this.leftPanel, R_ = this.rightPanel;
		ctx.save(); ctx.strokeStyle = css(L_.hl); ctx.lineCap = 'round'; ctx.lineWidth = 32 * 0.24;
		const iy = Math.max(40, top - 60);
		if (Menu.visible) { if (Menu.canGoBack()) drawBackIcon(ctx, 48, 48, 32); }
		else drawMenuIcon(ctx, 48, iy, 32);
		ctx.restore();
		if (!Menu.visible && Game.mode) {
			SDF.draw(ctx, String(this.displayedScore), vw / 2, Math.max(56, top - 60), 0, 1.1, -14.7, css(R_.hl));
			ctx.font = '28px SoubaScore'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
			let i = 0;
			for (const l of this.addLabels) {
				ctx.fillStyle = css(Style.current.ui_highlight_hover_color, clamp(l.alpha, 0, 1));
				ctx.fillText(l.text, vw / 2 + 110, Math.max(56, top - 60) + (l.y - 128) * 0.6);
				i++;
			}
		}
		if (Menu.visible) SDF.draw(ctx, this.title, vw / 2, Math.max(70, mid - 330), 0, 0.9, -15, css(L_.hl));
	},
	// pointer hits on the side panels; returns true when consumed
	panelAt(ux, uy) {
		if (View.compact) {
			if (ux < 110 && uy < Math.max(110, mid0() - 344 * Cam.zoom)) return this.leftPanel;
			return null;
		}
		if (this.leftPanel.contains(ux) && !this.leftPanel.disabled) return this.leftPanel;
		if (this.rightPanel.contains(ux)) return this.rightPanel;
		return null;
	},
	panelRelease(p) {
		if (p === this.leftPanel) { if (Menu.visible) Menu.tryBack(); else Menu.open(); }
		else if (p === this.rightPanel) {
			if (Menu.visible) { if (Menu.current === Screens.scores) Menu.tryClose(); else Menu.change(Screens.scores); }
			else { Menu.open(); Menu.change(Screens.scores); }
		}
	},
};
const mid0 = () => View.vh / 2;
function drawMenuIcon(ctx, cx, cy, extent) {
	const hw = extent * 0.5, gap = extent * 0.4;
	ctx.beginPath();
	for (const dy of [-gap, 0, gap]) { ctx.moveTo(cx - hw, cy + dy); ctx.lineTo(cx + hw, cy + dy); }
	ctx.stroke();
}
function drawBackIcon(ctx, cx, cy, extent) {
	const tipx = cx - extent * 0.55, head = extent * 0.24;
	ctx.beginPath();
	ctx.moveTo(tipx + head, cy - head); ctx.lineTo(tipx, cy); ctx.lineTo(tipx + head, cy + head);
	ctx.moveTo(tipx, cy); ctx.lineTo(cx + extent * 0.55, cy);
	ctx.stroke();
}

// ---------------------------------------------------------------- menu (DOM)
const menuEl = document.getElementById('menu');
const negativeEl = document.getElementById('negative');
const notifEl = document.getElementById('notif');
function el(tag, cls, text) {
	const e = document.createElement(tag);
	if (cls) e.className = cls;
	if (text != null) e.textContent = text;
	return e;
}
function button(label, onRelease, opts = {}) {
	const b = el('button', 'sb' + (opts.cls ? ' ' + opts.cls : ''));
	const l = el('span', 'lbl', label); b.appendChild(l);
	b.label = l;
	if (opts.desc) b.dataset.desc = opts.desc;
	b.addEventListener('pointerenter', () => { if (!b.disabled) UI.playHoverSound(true); if (opts.desc) Menu.setDesc(opts.desc); });
	b.addEventListener('focus', () => { if (opts.desc) Menu.setDesc(opts.desc); });
	b.addEventListener('pointerdown', () => { Audio2.unlock(); if (!b.disabled) UI.playButtonDown(); });
	b.addEventListener('click', (e) => {
		if (b.disabled) return;
		if (e.detail === 0) UI.playButtonDown();
		UI.playButtonUp();
		onRelease && onRelease(b, e);
	});
	return b;
}
function toggle(label, get, set, desc) {
	const b = button(label, () => { set(!get()); refresh(); }, { cls: 'toggle', desc });
	const pip = el('span', 'pip'); b.appendChild(pip);
	const refresh = () => b.classList.toggle('on', !!get());
	refresh();
	return b;
}
function slider(label, get, set, desc) {
	const b = el('div', 'sb slider');
	b.tabIndex = 0;
	const fill = el('div', 'fill'); b.appendChild(fill);
	const l = el('span', 'lbl', label); b.appendChild(l);
	const val = el('span', 'val'); b.appendChild(val);
	const refresh = () => { const v = get(); fill.style.width = (v * 100).toFixed(1) + '%'; val.textContent = Math.round(v * 100) + '%'; };
	let dragging = false, lastSound = get();
	const fromEvent = (e) => {
		const r = b.getBoundingClientRect();
		const v = clamp((e.clientX - r.left) / r.width, 0, 1);
		set(Math.round(v * 100) / 100); refresh();
		if (Math.abs(get() - lastSound) >= 0.05) { Audio2.play('stretch', { db: 10 }); lastSound = get(); }
	};
	b.addEventListener('pointerenter', () => { UI.playHoverSound(true); Menu.setDesc(desc); });
	b.addEventListener('pointerdown', (e) => { Audio2.unlock(); dragging = true; try { b.setPointerCapture(e.pointerId); } catch (err) {} b.classList.add('pressed'); UI.playButtonDown(); fromEvent(e); });
	b.addEventListener('pointermove', (e) => { if (dragging) fromEvent(e); });
	const end = () => { if (dragging) { dragging = false; b.classList.remove('pressed'); UI.playButtonUp(); } };
	b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
	b.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
			set(clamp(Math.round((get() + (e.key === 'ArrowLeft' ? -0.1 : 0.1)) * 10) / 10, 0, 1)); refresh();
			Audio2.play('stretch', { db: 10 }); e.preventDefault(); e.stopPropagation();
		}
	});
	refresh();
	return b;
}
