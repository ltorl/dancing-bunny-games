const Menu = {
	visible: false, current: null, animateGameOver: false, gameOverValue: 0,
	open() { this.openWith(Screens.main); },
	openWith(sc) {
		this.visible = true;
		menuEl.classList.add('show');
		Pauser.add('menu');
		UI.refreshPanelTargets();
		this.change(sc);
	},
	tryClose() {
		if (!Game.mode) return false;
		this.visible = false;
		menuEl.classList.remove('show');
		menuEl.replaceChildren();
		this.current = null;
		Pauser.remove('menu');
		UI.refreshPanelTargets();
		UI.title = 'sobosuba'; UI.titleScale = 1.5;
		return true;
	},
	tryBack() {
		if (!this.current) return false;
		if (this.current.parentId) { this.change(Screens[this.current.parentId]); return true; }
		return this.tryClose();
	},
	canGoBack() { return (this.current && this.current.parentId) || !!Game.mode; },
	change(sc) {
		if (sc === Screens.gameover && this.animateGameOver) {
			Audio2.play('gameover', {});
			this.gameOverValue = 0;
			UI.flasher = 1;
			this.animateGameOver = false;
		}
		this.current = sc;
		this.rebuild();
		UI.title = sc.title; UI.titleScale = sc.scale;
		UI.refreshPanelTargets();
		UI.leftPanel.xVel -= 1000; UI.rightPanel.xVel += 1000;
	},
	rebuild() {
		const sc = this.current;
		const root = el('div', 'screen');
		root.style.setProperty('--shift', '0');
		sc.root = root;
		sc.build(root);
		menuEl.replaceChildren(root);
		const first = root.querySelector('button, .slider');
		if (first && Input.device === 'gamepad') first.focus({ preventScroll: true });
	},
	setDesc(t) { const s = this.current && this.current.root; if (s && s.desc) s.desc.textContent = t || ''; },
	process(dt) {
		if (this.visible && this.current === Screens.gameover && this.current.root && this.current.root.big) {
			this.gameOverValue = lerp(this.gameOverValue, Score.current, Math.min(1, 2 * dt));
			this.current.root.big.textContent = String(Math.round(this.gameOverValue));
		}
	},
};

// ---------------------------------------------------------------- achievement notification
const Notif = {
	timeLeft: 0,
	init() {
		notifEl.addEventListener('click', () => {
			notifEl.classList.remove('show'); this.timeLeft = 0;
			if (Menu.visible) Menu.change(Screens.achievements); else Menu.openWith(Screens.achievements);
		});
		Achievements.unlockedSignal.connect((id) => {
			const d = Achievements.def(id); if (!d) return;
			notifEl.querySelector('.lbl').textContent = 'achievement!\n' + d.display_name;
			notifEl.classList.add('show', 'flash');
			setTimeout(() => notifEl.classList.remove('flash'), 60);
			this.timeLeft = 15;
			Audio2.play('achieve', {});
		});
	},
	process(dt) {
		if (this.timeLeft > 0) { this.timeLeft -= dt; if (this.timeLeft <= 0) notifEl.classList.remove('show'); }
	},
};

// ---------------------------------------------------------------- pauser
const Pauser = {
	requests: new Set(),
	add(r) { if (Game.mode && Game.mode.allowPausing) this.requests.add(r); },
	remove(r) { this.requests.delete(r); },
	get paused() { return this.requests.size > 0; },
};

// ---------------------------------------------------------------- game
const Game = {
	mode: null, frame: 0, session: 0,
	startMode() {
		const session = ++this.session;
		this.endMode();
		// GameModeManager awaits a process frame before instancing the mode
		requestAnimationFrame(() => {
			if (session !== this.session) return;
			this.mode = new BarMode();
			SignalBus.on_game_mode_start.emit(this.mode);
			Pauser.remove('main');
			Score.reset();
			UI.displayedScore = 0; UI.smoothedScore = 0;
			Menu.tryClose();
			UI.leftPanel.xVel = -10000;
			Audio2.play('start', { db: 9 });
			Cam.angVel = 20 * Rng.sign();
			Cam.zoom = 3;
			UI.negative = 1;
		});
	},
	endMode() {
		if (this.mode) {
			const m = this.mode; this.mode = null;
			SoboManager.freeAll();
			m.dispose();
		}
		world.clear();
		Shockwave.clear();
		Pauser.requests.clear();
		LaunchArrow.enabled = false;
		Score.reset();
	},
	physicsStep() {
		this.frame++;
		const m = this.mode;
		if (m) m.physicsProcess(DT);
		SoboManager.physicsProcess(DT);
		for (const s of SoboManager.allSobos) s.physicsProcess(DT, this.frame);
		Achievements.physicsProcess(DT);
		Shockwave.physicsProcess(DT);
		world.step(DT);
		for (const s of SoboManager.allSobos) s.refreshContacts();
		if (m && m.postPhysics) m.postPhysics();
	},
	process(dt) {
		Input.pollGamepad();
		Input.updateWorld();
		if (this.mode) this.mode.process(dt);
		for (const s of SoboManager.allSobos) {
			// SoboLabel: spring the label rotation toward the camera rotation
			const ad = angleDifference(s.labelRot, Cam.rotation);
			s.labelAngVel += (100000 / s.data.outer.area) * ad * dt;
			s.labelAngVel += (60000 / s.data.outer.area) * -s.labelAngVel * dt;
			s.labelRot += s.labelAngVel * dt;
		}
		LaunchArrow.process(dt);
		Cam.process(dt);
		UI.process(dt);
		Menu.process(dt);
		Notif.process(dt);
	},
	// input routing ------------------------------------------------------
	onDirection(dx, dy) {
		if (Menu.visible) { moveFocus(dx, dy); return; }
		if (this.mode && !Pauser.paused) this.mode.hoverInDir(dx, dy);
	},
	onLaunchButton() { if (this.mode && !Menu.visible && !Pauser.paused) this.mode.endLaunchDrag(); },
	onAccept() { if (Menu.visible && document.activeElement && document.activeElement.click) document.activeElement.click(); },
	onBack() {
		if (Menu.visible) Menu.tryBack();
		else if (this.mode && this.mode.isLaunching) this.mode.cancelLaunch();
	},
	onMenuButton() { if (Menu.visible) Menu.tryClose(); else Menu.open(); },
};
SignalBus.on_game_over.connect(() => {
	Menu.animateGameOver = true;
	Menu.openWith(Screens.gameover);
});

function moveFocus(dx, dy) {
	const items = [...menuEl.querySelectorAll('button:not([disabled]), .slider')];
	if (!items.length) return;
	const cur = document.activeElement;
	if (!items.includes(cur)) { items[0].focus(); return; }
	if (dx !== 0 && cur.classList.contains('slider')) {
		cur.dispatchEvent(new KeyboardEvent('keydown', { key: dx < 0 ? 'ArrowLeft' : 'ArrowRight' }));
		return;
	}
	const r0 = cur.getBoundingClientRect(), c0x = r0.left + r0.width / 2, c0y = r0.top + r0.height / 2;
	let best = null, bestScore = Infinity;
	for (const it of items) {
		if (it === cur) continue;
		const r = it.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
		const ax = cx - c0x, ay = cy - c0y;
		const along = ax * dx + ay * dy;
		if (along <= 1) continue;
		const score = along + Math.abs(ax * dy - ay * dx) * 2;
		if (score < bestScore) { bestScore = score; best = it; }
	}
	if (!best) best = dy > 0 || dx > 0 ? items[0] : items[items.length - 1];
	best.focus();
	UI.playHoverSound(false);
}

// ---------------------------------------------------------------- pointer input
let activePanel = null;
const pointers = new Map();
function uiCoords(e) { return [e.clientX / View.s + Cam.x, e.clientY / View.s + Cam.y]; }
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', (e) => {
	Audio2.unlock();
	Input.pointerType = e.pointerType;
	if (Input.device === 'gamepad') Input.device = 'mouse';
	pointers.set(e.pointerId, e);
	Input.sx = e.clientX; Input.sy = e.clientY; Input.hasCursor = true;
	Input.updateWorld();
	const m = Game.mode;
	if (e.button === 2 || (e.pointerType === 'touch' && pointers.size > 1)) {
		if (m && !Menu.visible) m.cancelLaunch();
		return;
	}
	if (e.button !== 0) return;
	try { stage.setPointerCapture(e.pointerId); } catch (err) {}
	if (m && !Menu.visible && !Pauser.paused && m.state === 'PLAYING') {
		// pp_mouse would have picked the hovered sobo already; touch has no hover so pick it now
		m.hovered = SoboManager.closestSoboCenter(Input.wx, Input.wy, 128, m.onBar);
		if (m.hovered) {
			Input.down = true; Input.startWx = Input.wx; Input.startWy = Input.wy; Input.dragX = 0; Input.dragY = 0;
			m.startLaunchDrag();
			return;
		}
	}
	const [ux, uy] = uiCoords(e);
	const p = UI.panelAt(ux, uy);
	if (p) { activePanel = p; p.pressed = true; UI.playButtonDown(); }
});
stage.addEventListener('pointermove', (e) => {
	if (e.pointerType === 'mouse') {
		Input.mouseSpeed = len(e.clientX - Input.sx, e.clientY - Input.sy) / View.s;
		if (Input.device === 'gamepad' && Input.mouseSpeed > 2) Input.device = 'mouse';
	}
	Input.pointerType = e.pointerType;
	Input.sx = e.clientX; Input.sy = e.clientY; Input.hasCursor = true;
	const [ux, uy] = uiCoords(e);
	const p = Menu.visible && !View.compact ? UI.panelAt(ux, uy) : (Game.mode && Game.mode.isLaunching ? null : UI.panelAt(ux, uy));
	for (const q of [UI.leftPanel, UI.rightPanel]) {
		const h = q === p;
		if (h && !q.hovered && !q.disabled) UI.playHoverSound(true);
		q.hovered = h;
	}
});
const endPointer = (e) => {
	pointers.delete(e.pointerId);
	if (e.pointerType !== 'mouse' && pointers.size === 0) Input.hasCursor = false;
	if (e.button !== 0 && e.type === 'pointerup') return;
	const m = Game.mode;
	if (Input.down) {
		Input.down = false;
		Input.sx = e.clientX; Input.sy = e.clientY;
		Input.updateWorld();
		if (m && e.type === 'pointerup') { Input.dragX = Input.wx - Input.startWx; Input.dragY = Input.wy - Input.startWy; m.ppMouse(); m.endLaunchDrag(); }
		else if (m) m.cancelLaunch();
	}
	if (activePanel) {
		const p = activePanel; activePanel = null; p.pressed = false;
		const [ux, uy] = uiCoords(e);
		if (e.type === 'pointerup' && UI.panelAt(ux, uy) === p) { UI.playButtonUp(); UI.panelRelease(p); }
		else UI.playButtonUp(true);
	}
	if (e.pointerType !== 'mouse') { UI.leftPanel.hovered = false; UI.rightPanel.hovered = false; }
};
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { Input.hasCursor = false; UI.leftPanel.hovered = UI.rightPanel.hovered = false; } });
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
	Audio2.unlock();
	if (e.key === 'Escape') { e.preventDefault(); if (Menu.visible) Menu.tryBack(); else if (Game.mode && Game.mode.isLaunching) Game.mode.cancelLaunch(); else Menu.open(); }
	else if (Menu.visible && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
		e.preventDefault();
		const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
		moveFocus(d[0], d[1]);
	}
});
window.addEventListener('resize', () => { View.resize(); if (Menu.visible && Menu.current) Menu.rebuild(); });
document.addEventListener('fullscreenchange', () => { if (Menu.visible && Menu.current === Screens.settings) Menu.rebuild(); });

// ---------------------------------------------------------------- styling hooks
function applyStyleVars() {
	const st = Style.current, r = document.documentElement.style;
	const set = (k, c) => r.setProperty(k, css(c));
	set('--hl', st.ui_highlight_color); set('--hl-hover', st.ui_highlight_hover_color); set('--hl-press', st.ui_highlight_pressed_color); set('--hl-dis', st.ui_highlight_disabled_color);
	set('--bg', st.ui_background_color); set('--bg-hover', st.ui_background_hover_color); set('--bg-press', st.ui_background_pressed_color); set('--bg-dis', st.ui_background_disabled_color);
	set('--page', st.background_color);
	document.body.style.background = css(st.background_color);
	const dark = (st.background_color[0] + st.background_color[1] + st.background_color[2]) / 3 < 0.5;
	document.body.classList.toggle('light', !dark);
}

// ---------------------------------------------------------------- loop
let lastT = 0, acc = 0;
function frame(t) {
	requestAnimationFrame(frame);
	const now = t / 1000;
	let dt = lastT ? now - lastT : DT;
	lastT = now;
	dt = Math.min(dt, 0.1);
	if (!Pauser.paused && Game.mode) {
		acc += dt;
		let steps = 0;
		while (acc >= DT && steps < 4) { Game.physicsStep(); acc -= DT; steps++; }
		if (steps === 4) acc = 0;
	} else acc = 0;
	Game.process(dt);
	drawWorld();
	GL.draw();
	UI.draw();
}

async function boot() {
	Settings.load();
	SoboManager.precompute();
	Style.changed.connect(applyStyleVars);
	Style.set(Settings.data.style);
	Score.init();
	Achievements.init();
	UI.init();
	Notif.init();
	View.resize();
	GL.init();
	Audio2.init();
	try { await Promise.all(['SoubaDisplay', 'SoubaText', 'SoubaScore'].map((f) => document.fonts.load(`30px ${f}`))); } catch (e) {}
	SDF.measure();
	Menu.open();
	requestAnimationFrame(frame);
}
boot();

</script>
