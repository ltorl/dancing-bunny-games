<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://cdn.jsdelivr.net/gh/ltorl/web-port@6817ad1064c7e7f18f8c1c28fa32b00133c183f9/thats-not-my-neighbor/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>That's not my neighbor</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="thats-not-my-neighbor.icon.png">
<link rel="apple-touch-icon" href="thats-not-my-neighbor.apple-touch-icon.png">
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: black; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: #161616; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice { display: none; background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0;
  font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
  <img id="status-splash" src="thats-not-my-neighbor.png" alt="">
  <progress id="status-progress"></progress>
  <div id="status-notice"></div>
</div>
<script>
(function () {
  const NAME = 'thats-not-my-neighbor';
  // jsDelivr refuses repos over 50 MB on some requests ("Package size exceeded"), so each
  // file is retried there and then fetched from raw.githubusercontent.com at the same commit.
  const SOURCES = [
    document.baseURI,
    'https://raw.githubusercontent.com/ltorl/web-port/6817ad1064c7e7f18f8c1c28fa32b00133c183f9/thats-not-my-neighbor/',
  ];
  async function get(path) {
    let lastErr;
    for (const base of [SOURCES[0], SOURCES[0], SOURCES[1], SOURCES[1]]) {
      try {
        const res = await fetch(base + path);
        if (res.ok) return res;
        lastErr = new Error('Failed to download ' + path + ' (HTTP ' + res.status + ')');
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  async function jsUrl(path) {
    return URL.createObjectURL(new Blob([await (await get(path)).text()], { type: 'text/javascript' }));
  }
  const PCK_SIZE = 410934256, WASM_SIZE = 43444261;
  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');

  function fail(err) {
    console.error(err);
    statusNotice.innerText = (err && err.message) || String(err) || 'An unknown error occurred.';
    statusNotice.style.display = 'block';
    statusProgress.style.display = 'none';
  }

  // Download the split .pck / .wasm parts in parallel with one combined progress bar.
  const total = PCK_SIZE + WASM_SIZE;
  let loaded = 0;
  statusProgress.max = total;
  async function fetchPart(url) {
    const res = await get(url);
    const reader = res.body.getReader(), chunks = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      statusProgress.value = loaded;
    }
    return new Blob(chunks);
  }
  function parts(file, n) {
    return Array.from({ length: n }, (_, i) => fetchPart(file + '.part' + (i + 1)));
  }
  async function merge(file, n, type) {
    return URL.createObjectURL(new Blob(await Promise.all(parts(file, n)), { type }));
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src; el.onload = resolve;
      el.onerror = () => reject(new Error('Failed to load the engine script'));
      document.head.appendChild(el);
    });
  }

  (async () => {
    const [engineUrl, workletUrl, posWorkletUrl] = await Promise.all([
      jsUrl(NAME + '.js'), jsUrl(NAME + '.audio.worklet.js'), jsUrl(NAME + '.audio.position.worklet.js'),
    ]);
    await loadScript(engineUrl);
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      throw new Error('The following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
    }
    if (window.AudioWorklet) {
      const origAdd = AudioWorklet.prototype.addModule;
      AudioWorklet.prototype.addModule = function (url, ...args) {
        const u = String(url);
        if (u.endsWith('.audio.position.worklet.js')) url = posWorkletUrl;
        else if (u.endsWith('.audio.worklet.js')) url = workletUrl;
        return origAdd.call(this, url, ...args);
      };
    }
    return Promise.all([
      merge(NAME + '.pck', 20, 'application/octet-stream'),
      merge(NAME + '.wasm', 3, 'application/wasm'),
    ]);
  })().then(([pckUrl, wasmUrl]) => {
    const origFetch = window.fetch.bind(window);
    window.fetch = function (url, ...args) {
      const u = typeof url === 'string' ? url : (url && url.url) || '';
      if (u.endsWith(NAME + '.pck')) return origFetch(pckUrl, ...args);
      if (u.endsWith(NAME + '.wasm')) return origFetch(wasmUrl, ...args);
      return origFetch(url, ...args);
    };
    statusProgress.removeAttribute('value');
    const engine = new Engine({
      args: [],
      canvasResizePolicy: 2,
      ensureCrossOriginIsolationHeaders: false,
      executable: NAME,
      experimentalVK: false,
      fileSizes: { [NAME + '.pck']: PCK_SIZE, [NAME + '.wasm']: WASM_SIZE },
      focusCanvas: true,
      gdextensionLibs: [],
    });
    return engine.startGame({
      onProgress(current, max) {
        if (current > 0 && max > 0) { statusProgress.value = current; statusProgress.max = max; }
      },
    });
  }).then(() => statusOverlay.remove(), fail);
})();
</script>
</body>
</html>
